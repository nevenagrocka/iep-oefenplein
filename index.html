  if(tb&&lz){if(T.tsText===it.text.t)tb.scrollTop=T.ts||0;tb.onscroll=()=>{T.ts=tb.scrollTop;T.tsText=it.text.t};
    const m=tb.querySelector("mark");if(m){tb.scrollTop=Math.max(0,m.offsetTop-tb.clientHeight/3);T.ts=tb.scrollTop;T.tsText=it.text.t}}
  const tbtn=app.querySelector("#tipb"); if(tbtn)tbtn.onclick=()=>{T.tip[T.i]=!T.tip[T.i];renderTest()};
  const inp=app.querySelector("#ans");
  if(inp){inp.oninput=()=>{T.answers[T.i]=inp.value}; inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();next()}}; if(!done)setTimeout(()=>inp.focus({preventScroll:true}),30)}
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{T.answers[T.i]=+b.dataset.k;renderTest()});
  app.querySelector("#next").onclick=next;
  const pv=app.querySelector("#prev"); if(pv)pv.onclick=()=>{T.i--;renderTest()};
  app.querySelector("#stop").onclick=()=>{T.stopAsk=true;renderTest()};
  const sy=app.querySelector("#stopYes"); if(sy){sy.onclick=()=>{S.test=null;S.view="home";render()};app.querySelector("#stopNo").onclick=()=>{T.stopAsk=false;renderTest()}}
  function next(){
    const v=T.answers[T.i]; const empty=v===null||v===undefined||String(v).trim()==="";
    if(T.mode==="oefen"&&!T.checked){if(empty){toast("Kies of typ eerst een antwoord.");return}
      if(lz){if(T.first[T.i]==null)T.first[T.i]=v;if(!checkAnswer(it,v)&&!T.retried[T.i]){T.retried[T.i]=true;T.wrong1[T.i]=v;T.answers[T.i]=null;renderTest();return}}
      T.checked=true;renderTest();return}
    T.checked=false;
    if(T.i<n-1){T.i++;renderTest();window.scrollTo({top:0,behavior:"smooth"})}else finish();
  }
}
async function finish(){
  const T=S.test; const items=T.items; const sv=i=>T.first[i]!=null?T.first[i]:T.answers[i]; T.sv=sv; const ok=items.map((it,i)=>checkAnswer(it,sv(i)));
  const correct=ok.filter(Boolean).length; const p=correct/items.length; const c=cijferOf(p);
  const cats={}; items.forEach((it,i)=>{cats[it.cat]=cats[it.cat]||{c:0,t:0};cats[it.cat].t++;if(ok[i])cats[it.cat].c++});
  T.result={correct,total:items.length,p,cijfer:c,cats,ok};
  S.view="results"; render(); window.scrollTo(0,0);
  const u=me(); if(u&&!T.saved){T.saved=true;
    const rec={id:uid(),studentId:u.id,subject:T.subject,q:T.q,skill:T.skill,mode:T.mode,correct,total:items.length,cijfer:c,cats,at:new Date().toISOString(),mins:Math.round((Date.now()-T.started)/60000),
      items:items.map((it,i)=>({p:strip(it.prompt).slice(0,160),c:it.cat,g:givenText(it,sv(i)).slice(0,80),k:String(answerText(it)).slice(0,80),ok:ok[i]}))};
    const saved=await Store.put("results",rec); if(saved)toast("Resultaat opgeslagen in de voortgang.");}
}
function barColor(p){return p>=.8?"var(--good)":p>=.55?"var(--sun)":"var(--bad)"}
function renderResults(){
  const T=S.test,Rz=T.result,sj=T.subject,nv=niveau(Rz.p,sj);
  const bg=Rz.cijfer>=7?"linear-gradient(135deg,#2FCB8A,#16A36A)":Rz.cijfer>=5.5?"linear-gradient(135deg,#FFC83D,#FF9A5C)":"linear-gradient(135deg,#FF5D73,#E0364F)";
  const doms=sj==="taal"?TAAL_DOMAINS:sj==="lezen"?LEZEN_DOMAINS.filter(d=>Rz.cats[d]):REKEN_DOMAINS.map(d=>d[1]);
  app.innerHTML=`<div class="card"><div class="resgrid">
    <div style="text-align:center"><div class="grade" style="background:${bg}"><div><div class="g">${cijferTxt(Rz.cijfer)}</div><small>${Rz.correct} van ${Rz.total} goed</small></div></div>
      <p style="margin:14px 0 6px"><span class="pill ${nv.c}">${nv.t}</span></p><p class="muted" style="font-size:.85rem;margin:0">${SUBJ[sj].n} · ${testLabel(T)} · indicatie referentieniveau</p></div>
    <div><h2>${Rz.cijfer>=8?"Super gedaan!":Rz.cijfer>=6.5?"Goed bezig!":Rz.cijfer>=5.5?"Voldoende, ga zo door!":"Blijf oefenen, je komt er wel!"}</h2>
     <h3 style="margin:16px 0 10px">Per onderdeel</h3><div class="bars">${doms.map(d=>{const c=Rz.cats[d]||{c:0,t:0};const p=c.t?c.c/c.t:0;return `<div class="bar"><span>${esc(d)}</span><span class="tr"><i style="width:${p*100}%;background:${barColor(p)}"></i></span><span class="v">${c.c}/${c.t}</span></div>`}).join("")}</div>
     <div class="actions" style="justify-content:flex-start"><button class="btn ${clsOf(sj)}" id="again" type="button">${T.q?`Nieuwe toets Q${T.q}`:"Nog een keer trainen"}</button><button class="btn ghost" id="toBoard" type="button">Voortgang</button><button class="btn ghost" id="toHome" type="button">Naar start</button></div>
    </div></div></div>
   <div class="card" style="margin-top:18px"><h3>Nakijken</h3><p class="muted" style="margin:4px 0 0">Bekijk wat goed en fout ging, met uitleg.</p>
    <div class="review">${T.items.map((it,i)=>{const ok=Rz.ok[i];return `<div class="ri ${ok?"ok":"no"}"><span class="n">${i+1}</span><div class="p">${it.text?`<span class="muted">Tekst: ${esc(it.text.t)} · </span>`:""}${esc(strip(it.prompt))}
      <div class="a">${T.first[i]!=null&&T.mode==="oefen"?"Je eerste antwoord":"Jouw antwoord"}: <b>${esc(givenText(it,T.sv(i)))}</b>${ok?" ✓":` · Goed antwoord: <b>${esc(answerText(it))}</b>`}</div>${ok?"":`<div class="e">${it.explain}</div>${it.ev?`<div class="ev">In de tekst: “${esc(it.ev)}”</div>`:""}${it.skill?`<div class="e"><b>Tip · ${esc(LSKILLS[it.skill].n)}:</b> ${esc(LSKILLS[it.skill].tip)}</div>`:""}`}</div></div>`}).join("")}</div></div>`;
  app.querySelector("#again").onclick=()=>{S.mode=T.mode;startTest(sj,T.q,T.skill)};
  app.querySelector("#toBoard").onclick=()=>{S.view="board";render()};
  app.querySelector("#toHome").onclick=()=>{S.view="home";S.test=null;render()};
}
function renderBoard(){
  const st=Store.students.slice().sort((a,b)=>a.name.localeCompare(b.name,"nl"));
  const last=sid=>{const r=resultsOf(sid)[0];return r?new Date(r.at).toLocaleDateString("nl-NL",{day:"numeric",month:"short"}):"–"};
  const cell=(sid,sj,q)=>{const b=best(sid,sj,q);return `<td><span class="sc ${scClass(b)}">${b==null?"–":cijferTxt(b)}</span></td>`};
  app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Voortgangsbord</h2><p class="muted" style="margin:6px 0 0">Beste cijfer per periode. Klik op een leerling voor details.</p></div>
   <div class="row"><button class="btn ghost" id="addU" type="button">Leerling toevoegen</button><button class="btn" id="bHome" type="button">Naar start</button></div></div>
   ${st.length?`<div class="tablewrap"><table class="board"><thead><tr><th class="l" rowspan="2">Leerling</th><th class="grp" colspan="4">Taal</th><th class="grp" colspan="4">Rekenen</th><th class="grp" colspan="4">Begr. lezen</th><th rowspan="2">Toetsen</th><th rowspan="2">Laatst</th></tr>
    <tr>${[1,2,3,4].map(q=>`<th>Q${q}</th>`).join("").repeat(3)}</tr></thead>
    <tbody>${st.map(s=>`<tr class="click" data-sid="${esc(s.id)}" tabindex="0"><td class="l"><span class="who">${avatar(s)}${esc(s.name)}</span></td>${[1,2,3,4].map(q=>cell(s.id,"taal",q)).join("")}${[1,2,3,4].map(q=>cell(s.id,"rekenen",q)).join("")}${[1,2,3,4].map(q=>cell(s.id,"lezen",q)).join("")}<td>${resultsOf(s.id).length}</td><td>${last(s.id)}</td></tr>`).join("")}</tbody></table></div>
    <p class="muted" style="font-size:.85rem;margin-top:12px"><span class="sc g">7,0+</span> goed &nbsp; <span class="sc w">5,5–6,9</span> voldoende &nbsp; <span class="sc b">&lt; 5,5</span> nog oefenen</p>`
   :`<div class="empty"><h3>Nog geen leerlingen</h3><p class="muted">Voeg de eerste leerling toe. Na elke toets verschijnt het cijfer hier.</p><button class="btn" id="addU2" type="button">Eerste leerling toevoegen</button></div>`}</div>`;
  const add=()=>openUsers(null,true);
  app.querySelector("#addU").onclick=add; const a2=app.querySelector("#addU2"); if(a2)a2.onclick=add;
  app.querySelector("#bHome").onclick=()=>{S.view="home";render()};
  app.querySelectorAll("[data-sid]").forEach(r=>{const go=()=>{S.boardStudent=r.dataset.sid;S.confirmDel=false;S.view="student";render();window.scrollTo(0,0)};r.onclick=go;r.onkeydown=e=>{if(e.key==="Enter")go()}});
}
function spark(vals){
  if(vals.length<2)return `<p class="muted">Maak minstens twee toetsen om een lijn te zien.</p>`;
  const W=420,H=120,p=24; const x=i=>p+i*(W-2*p)/(vals.length-1); const y=v=>H-p-(v-1)/9*(H-2*p);
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="cijferverloop">
   ${[1,5.5,10].map(v=>`<line x1="${p}" x2="${W-p}" y1="${y(v)}" y2="${y(v)}" stroke="#E4E0F5" ${v===5.5?'stroke-dasharray="4 4"':""}/><text x="${p-6}" y="${y(v)+4}" text-anchor="end" font-size="10">${comma(v)}</text>`).join("")}
   <polygon points="${x(0)},${H-p} ${pts} ${x(vals.length-1)},${H-p}" fill="rgba(138,92,255,.12)"/><polyline points="${pts}" fill="none" stroke="#8A5CFF" stroke-width="3" stroke-linejoin="round"/>
   <circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="5" fill="#8A5CFF"/></svg>`;
}
function renderStudent(){
  const s=Store.students.find(x=>x.id===S.boardStudent); if(!s){S.view="board";return renderBoard()}
  const rs=resultsOf(s.id); const avg=rs.length?rs.reduce((a,r)=>a+r.cijfer,0)/rs.length:null;
  const agg=sj=>{const o={};rs.filter(r=>r.subject===sj).forEach(r=>Object.entries(r.cats||{}).forEach(([k,v])=>{o[k]=o[k]||{c:0,t:0};o[k].c+=v.c;o[k].t+=v.t}));return o};
  const domBars=(sj,doms)=>{const a=agg(sj);return `<div class="bars">${doms.map(d=>{const c=a[d];const p=c&&c.t?c.c/c.t:null;return `<div class="bar"><span>${esc(d)}</span><span class="tr"><i style="width:${(p||0)*100}%;background:${p==null?"transparent":barColor(p)}"></i></span><span class="v">${p==null?"–":Math.round(p*100)+"%"}</span></div>`}).join("")}</div>`};
  const weak=[...Object.entries(agg("taal")),...Object.entries(agg("rekenen")),...Object.entries(agg("lezen"))].filter(([k,v])=>v.t>=3).sort((a,b)=>a[1].c/a[1].t-b[1].c/b[1].t)[0];
  app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div class="who">${avatar(s,true)}<div><h2>${esc(s.name)}</h2><span class="muted">${rs.length} toets${rs.length===1?"":"en"} gemaakt</span></div></div>
   <div class="row"><button class="btn" id="practice" type="button">Oefenen als ${esc(s.name)}</button><button class="btn ghost" id="bBack" type="button">Terug naar bord</button></div></div>
   <div class="stats"><div class="stat"><b>${avg==null?"–":cijferTxt(Math.round(avg*10)/10)}</b><span>Gemiddeld cijfer</span></div>
    <div class="stat"><b>${rs.filter(r=>r.subject==="taal").length}</b><span>Taaltoetsen</span></div><div class="stat"><b>${rs.filter(r=>r.subject==="rekenen").length}</b><span>Rekentoetsen</span></div><div class="stat"><b>${rs.filter(r=>r.subject==="lezen").length}</b><span>Leestoetsen</span></div>
    <div class="stat"><b style="font-size:1.15rem;line-height:1.6">${weak?esc(weak[0]):"–"}</b><span>Oefen dit het meest</span></div></div>
   <div class="two"><div><h3 style="margin-bottom:10px">Taal per onderdeel</h3>${domBars("taal",TAAL_DOMAINS)}</div><div><h3 style="margin-bottom:10px">Rekenen per onderdeel</h3>${domBars("rekenen",REKEN_DOMAINS.map(d=>d[1]))}</div></div>
   <div style="margin-top:18px"><h3 style="margin-bottom:10px">Begrijpend lezen per vaardigheid</h3><div class="two">${domBars("lezen",LEZEN_DOMAINS.slice(0,5))}${domBars("lezen",LEZEN_DOMAINS.slice(5))}</div></div>
   <h3 style="margin:22px 0 8px">Cijferverloop</h3>${spark(rs.slice().reverse().map(r=>r.cijfer))}
   <h3 style="margin:22px 0 4px">Alle toetsen</h3><div class="hist">${rs.length?rs.map(r=>`<div class="hrow"><span class="sc ${scClass(r.cijfer)}">${cijferTxt(r.cijfer)}</span><span>${SUBJ[r.subject].n} · ${r.q?"Q"+r.q:"Training"+(r.skill&&LSKILLS[r.skill]?": "+LSKILLS[r.skill].n:"")} · ${r.correct}/${r.total} goed <span class="muted">· ${r.mode==="toets"?"toets":"oefenen"}</span></span><span class="muted">${new Date(r.at).toLocaleDateString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span></div>`).join(""):`<p class="muted">Nog geen toetsen gemaakt.</p>`}</div>
   <div style="margin-top:22px">${S.confirmDel?`<div class="confirm">Leerling ${esc(s.name)} en alle ${rs.length} resultaten verwijderen? Dit kan niet ongedaan worden. <button class="btn danger" id="delYes" type="button">Ja, verwijderen</button><button class="btn ghost" id="delNo" type="button">Annuleren</button></div>`:`<button class="btn ghost" id="del" type="button">Leerling verwijderen</button>`}</div>
  </div>`;
  app.querySelector("#bBack").onclick=()=>{S.view="board";render()};
  app.querySelector("#practice").onclick=()=>{meId=s.id;lsSet(ME_KEY,meId);S.view="home";render()};
  const d=app.querySelector("#del"); if(d)d.onclick=()=>{S.confirmDel=true;renderStudent()};
  const dy=app.querySelector("#delYes"); if(dy){dy.onclick=async()=>{for(const r of rs){await Store.del("results",r.id)}await Store.del("students",s.id);if(meId===s.id){meId=null;lsSet(ME_KEY,null)}S.view="board";S.confirmDel=false;render();toast("Leerling verwijderd.")};app.querySelector("#delNo").onclick=()=>{S.confirmDel=false;renderStudent()}}
}
/* user picker */
function openUsers(after,startNew){
  const root=document.getElementById("modalRoot"); let col=COLORS[Store.students.length%COLORS.length]; let creating=!!startNew||Store.students.length===0;
  const close=()=>{root.innerHTML="";document.removeEventListener("keydown",onKey)};
  const onKey=e=>{if(e.key==="Escape")close()};
  document.addEventListener("keydown",onKey);
  function draw(){
    const st=Store.students.slice().sort((a,b)=>a.name.localeCompare(b.name,"nl"));
    root.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="card">
     <h2 id="mt">${creating?"Nieuwe leerling":"Wie oefent er?"}</h2>
     ${creating?`<form id="nf" style="display:grid;gap:14px;margin-top:14px"><label class="field" for="nm">Naam<input id="nm" maxlength="24" autocomplete="off" placeholder="Bijvoorbeeld Sanne" required></label>
       <div class="field">Kleur<div class="colors">${COLORS.map(c=>`<button type="button" data-c="${c}" aria-label="kleur" aria-pressed="${c===col}" style="background:${c}"></button>`).join("")}</div></div>
       <div class="actions">${st.length?`<button class="btn ghost" type="button" id="cb">Terug</button>`:`<button class="btn ghost" type="button" id="cx">Annuleren</button>`}<button class="btn" type="submit">Opslaan en kiezen</button></div></form>`
     :`<div class="ulist">${st.map(s=>`<button class="utile" type="button" data-id="${esc(s.id)}" aria-pressed="${s.id===meId}">${avatar(s,true)}<span>${esc(s.name)}</span></button>`).join("")}
       <button class="utile" type="button" id="nw"><span class="av lg" style="background:var(--mist);color:var(--ink)">+</span><span>Nieuwe leerling</span></button></div>
       <div class="actions"><button class="btn ghost" type="button" id="cx">Sluiten</button></div>`}
    </div></div>`;
    root.querySelector(".modal").onclick=e=>{if(e.target.classList.contains("modal"))close()};
    const cx=root.querySelector("#cx"); if(cx)cx.onclick=close;
    const cb=root.querySelector("#cb"); if(cb)cb.onclick=()=>{creating=false;draw()};
    const nw=root.querySelector("#nw"); if(nw)nw.onclick=()=>{creating=true;draw()};
    root.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{meId=b.dataset.id;lsSet(ME_KEY,meId);close();render();if(after)after()});
    root.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{col=b.dataset.c;root.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.c===col))});
    const f=root.querySelector("#nf"); if(f){const nm=root.querySelector("#nm");setTimeout(()=>nm.focus(),30);
      f.onsubmit=async e=>{e.preventDefault();const name=nm.value.trim();if(!name)return;
        if(Store.students.some(s=>s.name.toLowerCase()===name.toLowerCase())){toast("Die naam bestaat al. Kies hem uit de lijst of gebruik een andere naam.");return}
        const s={id:uid(),name,color:col,createdAt:new Date().toISOString()};const ok=await Store.put("students",s);
        if(ok){if(Store.mode==="shared"&&!Store.students.some(x=>x.id===s.id))Store.students.push(s);meId=s.id;lsSet(ME_KEY,meId);close();render();if(after)after()}}}
  }
  draw();
}
document.getElementById("userBtn").onclick=()=>openUsers(null);
document.getElementById("boardBtn").onclick=()=>{S.view="board";render()};
document.getElementById("homeBtn").onclick=()=>{if(S.view==="test"){S.test.stopAsk=true;renderTest();return}S.view="home";render()};
/* confetti background */
(()=>{const c=document.getElementById("confetti");const cols=["#FFFFFF","#FFC83D","#FF5D73","#2FCB8A","#5B6CFF","#FF9A5C"];let h="";for(let i=0;i<22;i++){const s=R(10,26);h+=`<i style="left:${R(0,100)}%;top:${R(0,100)}%;width:${s}px;height:${R(0,1)?s:s/2.5}px;background:${pick(cols)};transform:rotate(${R(0,180)}deg);animation-delay:-${R(0,14)}s"></i>`}c.innerHTML=h})();
render();
Store.init();
})();
</script>
