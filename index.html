<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IEP Oefenplein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: speelplein-achtergrond met kleurvlakken; één witte "werkkaart" per scherm, grote knoppen voor kinderen. Bewust één (lichte, kleurrijke) look. */
:root{
  --ink:#1F1A3D; --ink-2:#5B5680; --paper:#FFFFFF; --mist:#F4F2FF; --line:#E4E0F5;
  --taal:#FF5D73; --taal-2:#FF9A5C; --reken:#2BB3E8; --reken-2:#5B6CFF;
  --sun:#FFC83D; --mint:#2FCB8A; --grape:#8A5CFF;
  --good:#16A36A; --good-bg:#E3F8EE; --bad:#E0364F; --bad-bg:#FFE7EA; --warn:#D98A00; --warn-bg:#FFF3D6;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:var(--body);font-size:16px;color:var(--ink);background:#7FD6F5;
  background:
   radial-gradient(60vmax 60vmax at -10% -10%, #FFD45C 0, transparent 60%),
   radial-gradient(55vmax 55vmax at 110% 0%, #FF7FA0 0, transparent 60%),
   radial-gradient(60vmax 60vmax at 100% 110%, #8E7BFF 0, transparent 60%),
   radial-gradient(55vmax 55vmax at -5% 105%, #46D9A4 0, transparent 60%),
   #7FD6F5;
  background-attachment:fixed;
}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.confetti i{position:absolute;display:block;border-radius:6px;opacity:.55;animation:float 14s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-40px) rotate(160deg)}}
@media (prefers-reduced-motion:reduce){.confetti i{animation:none}*{transition:none!important}}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:14px 48px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--ink);background:none;border:0;cursor:pointer;padding:0}
.logo b{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--ink);color:var(--sun);font-size:1.3rem;transform:rotate(-6deg)}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:7px 14px 7px 7px;background:rgba(255,255,255,.9);color:var(--ink);font:700 .95rem var(--body);cursor:pointer;box-shadow:0 3px 0 rgba(31,26,61,.15)}
.chip.plain{padding:9px 16px}
.chip:hover{background:#fff}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font:800 .95rem var(--display);flex:none}
.av.lg{width:54px;height:54px;font-size:1.5rem}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.card{background:var(--paper);border-radius:var(--r);padding:22px;box-shadow:0 8px 0 rgba(31,26,61,.12),0 18px 40px rgba(31,26,61,.12)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800}
h2{font-size:1.7rem;font-weight:800}
h3{font-size:1.2rem;font-weight:700}
.muted{color:var(--ink-2)}
.hero{text-align:center;margin:18px 0 26px;color:var(--ink)}
.hero p{font-size:1.15rem;font-weight:700;margin:8px 0 0}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:640px){.big2{grid-template-columns:1fr}}
.bigbtn{position:relative;overflow:hidden;border:0;border-radius:32px;padding:28px 24px 26px;min-height:240px;color:#fff;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  box-shadow:0 10px 0 rgba(31,26,61,.25);transition:transform .15s, box-shadow .15s}
.bigbtn:hover{transform:translateY(-4px);box-shadow:0 14px 0 rgba(31,26,61,.25)}
.bigbtn:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(31,26,61,.25)}
.bigbtn.taal{background:linear-gradient(135deg,var(--taal),var(--taal-2))}
.bigbtn.reken{background:linear-gradient(135deg,var(--reken),var(--reken-2))}
.bigbtn .glyph{position:absolute;top:10px;right:18px;font:800 6.5rem/1 var(--display);opacity:.28;letter-spacing:-.04em}
.bigbtn .lbl{font:800 3rem/1 var(--display)}
.bigbtn .sub{font-weight:700;opacity:.95}
.qstrip{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.qpill{background:rgba(255,255,255,.25);border-radius:10px;padding:3px 9px;font:700 .82rem var(--body)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:13px 22px;font:800 1.05rem var(--body);cursor:pointer;background:var(--ink);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.ghost{background:var(--mist);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.taal{background:var(--taal)} .btn.reken{background:var(--reken-2)}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:18px}
.qcard{border:3px solid var(--line);border-radius:20px;padding:18px;background:var(--paper);display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s, transform .15s}
.qcard:hover{transform:translateY(-3px)}
.qcard .qn{font:800 2.4rem/1 var(--display)}
.qcard.taal:hover{border-color:var(--taal)} .qcard.reken:hover{border-color:var(--reken-2)}
.qcard.taal .qn{color:var(--taal)} .qcard.reken .qn{color:var(--reken-2)}
.best{margin-top:auto;font-weight:800;font-size:.9rem}
.seg{display:inline-flex;background:var(--mist);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:10px;padding:9px 14px;font:800 .95rem var(--body);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 2px 0 var(--line)}
/* test */
.testbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.prog{flex:1;min-width:140px;height:14px;border-radius:99px;background:rgba(255,255,255,.6);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--ink);transition:width .3s}
.tag{display:inline-block;border-radius:999px;padding:4px 12px;font:800 .78rem var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--mist);color:var(--ink-2)}
.tag.taal{background:#FFE5E9;color:#B8233A} .tag.reken{background:#E3EEFF;color:#2F3FC4}
.prompt{font-size:1.3rem;font-weight:700;line-height:1.45;margin:14px 0 18px}
.prompt .sum{font:800 1.7rem var(--display);white-space:nowrap}
.prompt .zin{display:block;margin-top:8px;padding:12px 16px;border-radius:14px;background:var(--mist);font-weight:700}
.prompt em{font-style:normal;background:var(--sun);padding:0 6px;border-radius:6px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-weight:800;margin:0 2px}
.frac span:first-child{border-bottom:2px solid currentColor;padding:0 3px 2px}
.frac span:last-child{padding-top:2px}
.text{max-height:46vh;overflow:auto;border-radius:16px;background:#FFFBEA;border:2px solid #F6E6A6;padding:16px 18px;line-height:1.7;font-size:1.02rem;margin-top:12px}
.text h4{margin:0 0 6px;font:800 1.15rem var(--display)}
.text p{margin:0 0 10px;max-width:68ch}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 14px;font:700 1.05rem var(--body);color:var(--ink);cursor:pointer}
.opt .k{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--mist);font:800 .95rem var(--display)}
.opt:hover{border-color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--mist)}
.opt[aria-pressed="true"] .k{background:var(--ink);color:#fff}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.ok .k{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-bg)} .opt.no .k{background:var(--bad);color:#fff}
.ansrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ansrow input{font:800 1.5rem var(--display);padding:10px 16px;border-radius:16px;border:3px solid var(--line);width:min(260px,100%);color:var(--ink);background:#fff}
.ansrow input:focus{border-color:var(--ink);outline:none}
.ansrow .unit{font:800 1.3rem var(--display);color:var(--ink-2)}
.hint{font-size:.88rem;color:var(--ink-2);margin-top:8px}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;font-weight:700;line-height:1.5}
.fb.ok{background:var(--good-bg);color:#0C6B45} .fb.no{background:var(--bad-bg);color:#9C1C30}
.fb strong{font-family:var(--display);font-size:1.25rem;display:block}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
svg text{font-family:var(--body);font-weight:700;fill:var(--ink)}
.fig{margin:6px 0 4px;max-width:100%;overflow-x:auto}
table.tt{border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:8px}
table.tt th,table.tt td{border:2px solid var(--line);padding:6px 12px;text-align:center}
table.tt th{background:var(--mist)}
/* results */
.resgrid{display:grid;grid-template-columns:240px 1fr;gap:22px;align-items:start}
@media (max-width:720px){.resgrid{grid-template-columns:1fr}}
.grade{display:grid;place-items:center;width:190px;height:190px;border-radius:50%;margin:0 auto;color:#fff;text-align:center}
.grade .g{font:800 4.4rem/1 var(--display)}
.grade small{font-weight:800;opacity:.9}
.pill{display:inline-block;border-radius:999px;padding:5px 12px;font:800 .85rem var(--body)}
.pill.good{background:var(--good-bg);color:#0C6B45} .pill.warn{background:var(--warn-bg);color:#8A5600} .pill.bad{background:var(--bad-bg);color:#9C1C30}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 54px;gap:10px;align-items:center;font-weight:700}
.bar .tr{height:14px;background:var(--mist);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.review{display:grid;gap:10px;margin-top:10px}
.ri{border-radius:14px;padding:12px 14px;border:2px solid var(--line);display:grid;grid-template-columns:34px 1fr;gap:10px}
.ri .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font:800 .9rem var(--display)}
.ri.ok .n{background:var(--good)} .ri.no .n{background:var(--bad)}
.ri .p{font-weight:700;min-width:0}
.ri .a{font-size:.93rem;margin-top:4px}
.ri .e{font-size:.9rem;color:var(--ink-2);margin-top:4px}
/* board */
.tablewrap{overflow-x:auto;margin-top:14px}
table.board{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;min-width:720px}
table.board th{font:800 .78rem var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);text-align:center;padding:8px 6px;border-bottom:2px solid var(--line)}
table.board th.l, table.board td.l{text-align:left}
table.board td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center;font-weight:700}
table.board tr.click{cursor:pointer} table.board tr.click:hover td{background:var(--mist)}
.sc{display:inline-block;min-width:44px;border-radius:10px;padding:4px 6px;font:800 .95rem var(--display)}
.sc.g{background:var(--good-bg);color:#0C6B45} .sc.w{background:var(--warn-bg);color:#8A5600} .sc.b{background:var(--bad-bg);color:#9C1C30} .sc.e{color:#B9B4D6}
th.grp{color:var(--ink)!important}
.who{display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--mist);border-radius:16px;padding:12px 14px}
.stat b{display:block;font:800 1.8rem var(--display)}
.stat span{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.hist{display:grid;gap:6px;margin-top:8px}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--mist);font-weight:700;font-size:.95rem}
/* modal */
.modal{position:fixed;inset:0;background:rgba(31,26,61,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:16px 0}
.utile{border:3px solid var(--line);border-radius:18px;background:#fff;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font:800 1rem var(--body);color:var(--ink)}
.utile[aria-pressed="true"]{border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
.field input{font:700 1.1rem var(--body);padding:11px 14px;border-radius:14px;border:3px solid var(--line)}
.field input:focus{border-color:var(--ink);outline:none}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
.store{font-size:.8rem;font-weight:700;color:var(--ink);background:rgba(255,255,255,.6);border-radius:999px;padding:4px 10px}
.empty{text-align:center;padding:30px 10px}
.confirm{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--bad-bg);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
</style>
</head>
<body>

<div class="confetti" aria-hidden="true" id="confetti"></div>
<div class="wrap">
  <header class="top">
    <button class="logo" id="homeBtn" type="button"><b>8</b>IEP Oefenplein</button>
    <span class="sp"></span>
    <span class="store" id="storeBadge">Laden…</span>
    <button class="chip plain" id="boardBtn" type="button">Voortgang</button>
    <button class="chip" id="userBtn" type="button"></button>
  </header>
  <main id="app"></main>
</div>
<div id="modalRoot"></div>

<script>
(() => {
"use strict";
/* ============ helpers ============ */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(x,d=6)=>Math.round(x*10**d)/10**d;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip=h=>String(h).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
function nf(n,d=3){n=rnd(n,d);const neg=n<0;n=Math.abs(n);let [i,f]=String(n).split(".");i=i.replace(/\B(?=(\d{3})+(?!\d))/g,".");return (neg?"−":"")+i+(f?","+f:"")}
const eur=n=>{const [i,f=""]=nf(n,2).split(",");return "€ "+i+","+(f+"00").slice(0,2)};
const dur=m=>{const h=Math.floor(m/60),r=m%60;return h&&r?`${h} uur en ${r} minuten`:h?`${h} uur`:`${r} minuten`};
const fr=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const hm=m=>{m=((m%1440)+1440)%1440;return Math.floor(m/60)+"."+String(m%60).padStart(2,"0")};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const comma=x=>String(x).replace(".",",");
function parseNums(s){
  s=String(s).trim().replace(/−/g,"-").replace(/\s/g,"").replace(/[^\d.,\-]/g,"");
  if(!s||s==="-")return [];
  const out=[];
  if(s.includes(",")){out.push(+s.replace(/\./g,"").replace(",","."))}
  else{out.push(+s);out.push(+s.replace(/\./g,""))}
  return out.filter(x=>Number.isFinite(x));
}
function parseFrac(s){
  s=String(s).trim().replace(/\s+/g," ");
  let m=s.match(/^(-?\d+) (\d+)\/(\d+)$/); if(m){const w=+m[1],n=+m[2],d=+m[3];if(!d)return null;return {n:w*d+n,d}}
  m=s.match(/^(-?\d+)\s?\/\s?(\d+)$/); if(m){if(!+m[2])return null;return {n:+m[1],d:+m[2]}}
  const v=parseNums(s); if(v.length) return {n:v[0],d:1};
  return null;
}
function parseTime(s){
  const m=String(s).trim().match(/^(\d{1,2})\s?[.:,u]\s?(\d{2})(\s?uur)?$/i); if(!m)return null;
  const h=+m[1],mi=+m[2]; if(h>23||mi>59)return null; return h*60+mi;
}

/* ============ REKENEN generators ============ */
const RK={};
RK.getallen=[
 q=>{ // optellen / aftrekken
  const d=[0,4,5,5,6][q]; const dec=q>=3&&Math.random()<.5;
  let a=R(10**(d-1),10**d-1), b=R(10**(d-2),10**d-1);
  if(dec){a/=100;b/=100}
  const plus=Math.random()<.5; if(!plus&&b>a)[a,b]=[b,a];
  const ans=rnd(plus?a+b:a-b,2);
  return {kind:"num",prompt:`Reken uit:<br><span class="sum">${nf(a)} ${plus?"+":"−"} ${nf(b)} =</span>`,answer:ans,
   explain:`${nf(a)} ${plus?"+":"−"} ${nf(b)} = ${nf(ans)}. Zet de getallen netjes onder elkaar${dec?", komma onder komma":""}.`};
 },
 q=>{ // vermenigvuldigen
  let a,b,ans;
  if(q===1){a=R(12,98);b=R(3,9)} else if(q===2){a=R(13,89);b=R(12,49)} else if(q===3){a=R(105,489);b=R(12,38)} else {a=R(12,95)/10;b=R(14,48)}
  ans=rnd(a*b,2);
  return {kind:"num",prompt:`Reken uit:<br><span class="sum">${nf(a)} × ${nf(b)} =</span>`,answer:ans,
   explain:`${nf(a)} × ${nf(b)} = ${nf(ans)}. Tip: splits het getal, bijvoorbeeld ${nf(b)} = ${Math.floor(b/10)*10} + ${rnd(b%10,2)}.`};
 },
 q=>{ // delen
  let b,c;
  if(q===1){b=R(3,9);c=R(12,99)} else if(q===2){b=pick([12,15,16,25]);c=R(12,60)} else if(q===3){b=R(13,32);c=R(21,120)} else {b=pick([4,5,8]);c=0}
  let a=b*c; if(q===4){a=R(101,499);c=rnd(a/b,3)}
  return {kind:"num",prompt:`Reken uit:<br><span class="sum">${nf(a)} : ${b} =</span>`,answer:rnd(c,3),
   explain:`${nf(a)} : ${b} = ${nf(c)}. Controle: ${nf(c)} × ${b} = ${nf(a)}.`};
 },
 q=>{ // volgorde van bewerkingen
  if(q===1) return RK.getallen[0](q);
  let p,ans,e;
  if(q===2){const a=R(2,20),b=R(2,9),c=R(2,9);p=`${a} + ${b} × ${c}`;ans=a+b*c;e=`Eerst keer: ${b} × ${c} = ${b*c}, dan ${a} + ${b*c} = ${ans}.`}
  else if(q===3){const a=R(2,12),b=R(2,9),c=R(2,6),d=R(1,10);p=`(${a} + ${b}) × ${c} − ${d}`;ans=(a+b)*c-d;e=`Eerst haakjes: ${a+b}. Dan × ${c} = ${(a+b)*c}. Dan − ${d} = ${ans}.`}

 {lvl:2,t:"Een skatebaan voor Molenwijk",p:["Geachte leden van de gemeenteraad,","Wij zijn leerlingen van groep 8 van basisschool De Wilg. In onze wijk wonen veel kinderen, maar er is bijna geen plek om te spelen. Op het grasveld naast de school mag niet gevoetbald worden, en de dichtstbijzijnde speeltuin is voor kleine kinderen. Daarom vragen wij u om een skatebaan aan te leggen op het lege terrein bij de bibliotheek.","Een skatebaan is niet alleen leuk, maar ook gezond. Kinderen bewegen dan meer en zitten minder achter een scherm. Bovendien kunnen jongeren elkaar daar ontmoeten. Wij hebben al 214 handtekeningen verzameld van mensen uit de wijk die het met ons eens zijn.","Wilt u ons voorstel bespreken in de volgende vergadering?","Met vriendelijke groet,<br>Groep 8 van De Wilg"],

 {lvl:3,t:"De Afsluitdijk",p:["Vroeger was het IJsselmeer geen meer, maar een zee: de Zuiderzee. Bij zware stormen stroomde het zoute water vaak over de dijken. In 1916 ging het opnieuw mis. Grote delen van Noord-Holland kwamen onder water te staan. Na die ramp besloot de regering dat er iets moest gebeuren. Ingenieur Cornelis Lely had al jaren eerder een plan bedacht: een lange dijk dwars door de zee.","In 1927 begon de bouw. Duizenden arbeiders werkten jarenlang aan de dijk, vaak in weer en wind. Op 28 mei 1932 werd het laatste gat gedicht. De Afsluitdijk is ruim 32 kilometer lang. Achter de dijk veranderde de zoute zee langzaam in een zoet meer. Dat had ook nadelen: vissers die op zoutwatervis visten, raakten hun werk kwijt."],

 {lvl:3,t:"De laatste bus",p:["Mila keek op haar telefoon: 21.47 uur. De laatste bus zou om 21.50 uur vertrekken. Ze rende de trap van het station af, haar tas bonkend tegen haar rug. Bij de bushalte was het stil. Te stil. Ze speurde de straat af, maar zag alleen de rode achterlichten van een bus die net de hoek om verdween.","'Nee, hè,' zuchtte ze. Ze plofte neer op het bankje. Het begon zachtjes te regenen. Mila overwoog haar vader te bellen, maar die zou boos zijn, want ze had beloofd op tijd te zijn. Toen hoorde ze een stem naast zich. 'Jij moet ook naar Oosterhout?' Een oudere vrouw met een groene paraplu glimlachte. 'Mijn zoon komt me zo halen. Je mag wel meerijden, als je ouders dat goed vinden.'"],

 {lvl:4,t:"Bijen in de stad",p:["Steeds meer mensen zetten een bijenkast op hun dak of in hun tuin. Ze willen de bij helpen, want het gaat niet goed met veel bijensoorten. In Nederland leven ruim 350 soorten bijen. Ongeveer de helft daarvan staat op de Rode Lijst: de lijst van bedreigde soorten.","Toch zijn niet alle onderzoekers blij met al die bijenkasten. In de kasten wonen bijna altijd honingbijen. Die worden door imkers gehouden en zijn niet bedreigd. Wilde bijen, zoals de metselbij en de hommel, zoeken voedsel op dezelfde bloemen. Als er te veel honingbijen zijn, blijft er voor wilde bijen te weinig over. Wie wilde bijen echt wil helpen, kan daarom beter bloemen planten die laat in het seizoen bloeien en tegels uit de tuin halen. Volgens mij is dat ook nog eens veel mooier dan een grijze tuin."],

 {lvl:4,t:"Slapen is topsport",p:["Kinderen van 10 tot 12 jaar hebben elke nacht ongeveer negen tot elf uur slaap nodig. Uit onderzoek blijkt dat veel kinderen in groep 7 en 8 minder slapen. Dat heeft gevolgen. Wie te weinig slaapt, kan zich slechter concentreren en onthoudt minder van wat hij heeft geleerd.","Tijdens je slaap gebeurt er namelijk veel in je hersenen. Ze ordenen wat je die dag hebt meegemaakt, ongeveer zoals je een rommelige kast opruimt. Ook groeit je lichaam vooral 's nachts.","Een belangrijke oorzaak van slaaptekort is het scherm. Het blauwe licht van een telefoon of tablet houdt je hersenen wakker. Slaaponderzoekers raden daarom aan om een uur voor het slapengaan geen schermen meer te gebruiken."],

function poolBy(arr,q,lvlOf){
  const near=arr.filter(x=>lvlOf(x)<=q&&lvlOf(x)>=q-1); const all=arr.filter(x=>lvlOf(x)<=q);
  return near.length>=4?near:all;
}
function makeTaal(q){
  const items=[];
  // Lezen: 1 tekst (3 vragen) + 1 tekst (1 vraag) + 1 signaalwoord
  const tx=shuffle(poolBy(TEKSTEN,q,t=>t.lvl)).slice(0,2);
  const qsets=[shuffle(tx[0].v).slice(0,3),shuffle(tx[1]?tx[1].v:[]).slice(0,1)];
  tx.forEach((t,ti)=>qsets[ti].forEach(v=>{const opts=shuffle(v[1]);items.push({kind:"mc",cat:"Lezen",text:t,prompt:v[0],options:opts,answer:opts.indexOf(v[1][0]),explain:v[2]})}));
  const sg=shuffle(poolBy(SIGNAAL,q,s=>s[3])).slice(0,5-items.length);
  sg.forEach(s=>{const opts=shuffle([s[1],...s[2]]);items.push({kind:"mc",cat:"Lezen",prompt:`Welk signaalwoord past op de puntjes? <span class="zin">${s[0].replace("___","<em>…</em>")}</span>`,options:opts,answer:opts.indexOf(s[1]),explain:`'${s[1]}' past: het laat het goede verband tussen de zinsdelen zien.`})});
  // Werkwoordspelling 5
  const seen=new Set(); let guard=0;
  while(items.filter(i=>i.cat==="Werkwoordspelling").length<5&&guard++<60){const it=wwItem(q);if(seen.has(it.prompt))continue;seen.add(it.prompt);items.push(it)}
  // Spelling & interpunctie 4
  shuffle(poolBy(SPELL,q,s=>s[1])).slice(0,2).forEach(s=>{const opts=shuffle(s[0]);items.push({kind:"mc",cat:"Spelling & interpunctie",prompt:"Welk woord is goed geschreven?",options:opts,answer:opts.indexOf(s[0][0]),explain:`Goed is: ${s[0][0]}.`})});
  shuffle(poolBy(PUNCT,q,s=>s[1])).slice(0,2).forEach(s=>{const opts=shuffle(s[0]);items.push({kind:"mc",cat:"Spelling & interpunctie",prompt:"Welke zin is goed geschreven (hoofdletters en leestekens)?",options:opts,answer:opts.indexOf(s[0][0]),explain:s[2]})});
  // Grammatica 3
  const gs=new Set();guard=0;
  while(items.filter(i=>i.cat==="Grammatica").length<3&&guard++<40){const it=grammarItem(q);if(gs.has(it.prompt))continue;gs.add(it.prompt);if(it._cor){it.answer=it.options.indexOf(it._cor);delete it._cor}items.push(it)}
  // Woordenschat 3
  shuffle(poolBy(WOORDEN,q,w=>w[3])).slice(0,3).forEach(w=>{const opts=shuffle([w[1],...w[2]]);const idiom=w[0].includes(" ")&&w[0][0]===w[0][0].toUpperCase();
    items.push({kind:"mc",cat:"Woordenschat",prompt:idiom?`Wat betekent de uitdrukking <em>${w[0]}</em>?`:`Wat betekent <em>${w[0]}</em>?`,options:opts,answer:opts.indexOf(w[1]),explain:`'${w[0]}' betekent: ${w[1]}.`})});
  return items;
}
const TAAL_DOMAINS=["Lezen","Werkwoordspelling","Spelling & interpunctie","Grammatica","Woordenschat"];

/* ============ checking & grading ============ */
function checkAnswer(it,val){
  if(it.kind==="mc") return val===it.answer;
  if(it.kind==="num") return parseNums(val).some(x=>Math.abs(x-it.answer)<1e-6);
  if(it.kind==="time"){const t=parseTime(val);return t!==null&&((t-it.answer)%1440+1440)%1440===0}
  if(it.kind==="frac"){const f=parseFrac(val);if(!f)return false;const same=Math.abs(f.n/f.d-it.answer.n/it.answer.d)<1e-9;if(!same)return false;if(it.simplest)return gcd(f.n,f.d)===1&&f.d===it.answer.d;return true}
  return false;
}
function answerText(it){
  if(it.kind==="mc")return it.options[it.answer];
  if(it.kind==="num")return nf(it.answer,4)+(it.unit?" "+it.unit:"");
  if(it.kind==="time")return hm(it.answer)+" uur";
  if(it.kind==="frac")return it.answer.d===1?String(it.answer.n):`${it.answer.n}/${it.answer.d}`;
}
function givenText(it,val){
  if(val===null||val===undefined||val==="")return "geen antwoord";
  if(it.kind==="mc")return it.options[val]??"geen antwoord";
  return String(val)+(it.unit&&it.kind==="num"?" "+it.unit:"");
}
const cijferOf=p=>Math.max(1,Math.round((1+9*p)*10)/10);
const cijferTxt=c=>comma(c.toFixed(1));
function niveau(p,subject){
  if(p>=.8)return {t:subject==="taal"?"Richting 2F":"Richting 1S",c:"good"};
  if(p>=.55)return {t:"1F gehaald",c:"warn"};
  return {t:"Nog oefenen (onder 1F)",c:"bad"};
}
const scClass=c=>c==null?"e":c>=7?"g":c>=5.5?"w":"b";

/* ============ storage ============ */
const LS_KEY="iep-oefenplein-v1", ME_KEY="iep-oefenplein-me";
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const Store={mode:"local",db:null,students:[],results:[],
  async init(){
    const loc=lsGet(LS_KEY,{students:[],results:[]}); this.students=loc.students||[]; this.results=loc.results||[];
    setBadge();
    let db=null; try{ if(window.claude&&window.claude.use) db=await window.claude.use("db"); }catch(e){db=null}
    if(!db){setBadge();render();return}
    this.db=db; this.mode="shared"; this.students=[]; this.results=[]; setBadge();
    db.collection("students").onSnapshot(s=>{this.students=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},e=>this.fail(e));
    db.collection("results").orderBy("at","desc").limit(1000).onSnapshot(s=>{this.results=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},e=>this.fail(e));
  },
  fail(e){ if(this.mode==="shared"){toast("Gedeelde opslag niet bereikbaar. Resultaten worden op dit apparaat bewaard.");this.mode="local";this.db=null;const loc=lsGet(LS_KEY,{students:[],results:[]});this.students=loc.students;this.results=loc.results;setBadge();render()} },
  saveLocal(){lsSet(LS_KEY,{students:this.students,results:this.results})},
  async put(col,obj){
    if(this.mode==="shared"){try{const {id,...rest}=obj;await this.db.collection(col).doc(id).set(rest);return true}catch(e){
      if(e&&e.code==="invalid_argument"){toast("Je hebt alleen kijkrechten. Vraag de eigenaar om je 'Contributor' te maken om resultaten op te slaan.");return false}
      if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{const {id,...rest}=obj;await this.db.collection(col).doc(id).set(rest);return true}catch(e2){}}
      toast("Opslaan lukte niet: "+(e&&e.message||"onbekende fout"));return false}}
    const arr=col==="students"?this.students:this.results; const i=arr.findIndex(x=>x.id===obj.id); if(i>=0)arr[i]=obj; else arr.unshift(obj); this.saveLocal(); render(); return true;
  },
  async del(col,id){
    if(this.mode==="shared"){try{await this.db.collection(col).doc(id).delete();return true}catch(e){toast("Verwijderen lukte niet.");return false}}
    if(col==="students")this.students=this.students.filter(x=>x.id!==id); else this.results=this.results.filter(x=>x.id!==id); this.saveLocal(); render(); return true;
  }
};
function setBadge(){const b=document.getElementById("storeBadge");b.textContent=Store.mode==="shared"?"Gedeelde voortgang":"Opgeslagen op dit apparaat";b.title=Store.mode==="shared"?"Leerlingen en resultaten worden gedeeld met iedereen die deze app opent.":"Je bent niet ingelogd of gedeelde opslag is niet beschikbaar; alles blijft in deze browser."}

  app.innerHTML=`

   </div>`;
  const inp=app.querySelector("#ans");

async function finish(){

  T.result={correct,total:items.length,p,cijfer:c,cats,ok};

  const u=me(); if(u&&!T.saved){T.saved=true;
    const rec={id:uid(),studentId:u.id,subject:T.subject,q:T.q,mode:T.mode,correct,total:items.length,cijfer:c,cats,at:new Date().toISOString(),mins:Math.round((Date.now()-T.started)/60000),

function spark(vals){

  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="cijferverloop">
   ${[1,5.5,10].map(v=>`<line x1="${p}" x2="${W-p}" y1="${y(v)}" y2="${y(v)}" stroke="#E4E0F5" ${v===5.5?'stroke-dasharray="4 4"':""}/><text x="${p-6}" y="${y(v)+4}" text-anchor="end" font-size="10">${comma(v)}</text>`).join("")}
   <polygon points="${x(0)},${H-p} ${pts} ${x(vals.length-1)},${H-p}" fill="rgba(138,92,255,.12)"/><polyline points="${pts}" fill="none" stroke="#8A5CFF" stroke-width="3" stroke-linejoin="round"/>
   <circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="5" fill="#8A5CFF"/></svg>`;
}

     :`<div class="ulist">${st.map(s=>`<button class="utile" type="button" data-id="${esc(s.id)}" aria-pressed="${s.id===meId}">${avatar(s,true)}<span>${esc(s.name)}</span></button>`).join("")}

    </div></div>`;
    root.querySelector(".modal").onclick=e=>{if(e.target.classList.contains("modal"))close()};

  }
  draw();
}
