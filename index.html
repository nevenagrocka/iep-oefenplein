<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IEP Oefenplein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: speelplein-achtergrond met kleurvlakken; één witte "werkkaart" per scherm, grote knoppen voor kinderen. Bewust één (lichte, kleurrijke) look. */
:root{
  --ink:#1F1A3D; --ink-2:#5B5680; --paper:#FFFFFF; --mist:#F4F2FF; --line:#E4E0F5;
  --taal:#FF5D73; --taal-2:#FF9A5C; --reken:#2BB3E8; --reken-2:#5B6CFF; --lees:#1DBF84; --lees-2:#0E9AA7;
  --sun:#FFC83D; --mint:#2FCB8A; --grape:#8A5CFF;
  --good:#16A36A; --good-bg:#E3F8EE; --bad:#E0364F; --bad-bg:#FFE7EA; --warn:#D98A00; --warn-bg:#FFF3D6;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:var(--body);font-size:16px;color:var(--ink);background:#7FD6F5;
  background:
   radial-gradient(60vmax 60vmax at -10% -10%, #FFD45C 0, transparent 60%),
   radial-gradient(55vmax 55vmax at 110% 0%, #FF7FA0 0, transparent 60%),
   radial-gradient(60vmax 60vmax at 100% 110%, #8E7BFF 0, transparent 60%),
   radial-gradient(55vmax 55vmax at -5% 105%, #46D9A4 0, transparent 60%),
   #7FD6F5;
  background-attachment:fixed;
}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.confetti i{position:absolute;display:block;border-radius:6px;opacity:.55;animation:float 14s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-40px) rotate(160deg)}}
@media (prefers-reduced-motion:reduce){.confetti i{animation:none}*{transition:none!important}}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:14px 48px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--ink);background:none;border:0;cursor:pointer;padding:0}
.logo b{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--ink);color:var(--sun);font-size:1.3rem;transform:rotate(-6deg)}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:7px 14px 7px 7px;background:rgba(255,255,255,.9);color:var(--ink);font:700 .95rem var(--body);cursor:pointer;box-shadow:0 3px 0 rgba(31,26,61,.15)}
.chip.plain{padding:9px 16px}
.chip:hover{background:#fff}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font:800 .95rem var(--display);flex:none}
.av.lg{width:54px;height:54px;font-size:1.5rem}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.card{background:var(--paper);border-radius:var(--r);padding:22px;box-shadow:0 8px 0 rgba(31,26,61,.12),0 18px 40px rgba(31,26,61,.12)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800}
h2{font-size:1.7rem;font-weight:800}
h3{font-size:1.2rem;font-weight:700}
.muted{color:var(--ink-2)}
.hero{text-align:center;margin:18px 0 26px;color:var(--ink)}
.hero p{font-size:1.15rem;font-weight:700;margin:8px 0 0}
.big2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.bigbtn.lees{background:linear-gradient(135deg,var(--lees),var(--lees-2))}
.btn.lees{background:#0E8F6A}
.tag.lees{background:#DDF6EC;color:#0B6E4F}
.qcard.lees:hover{border-color:var(--lees)} .qcard.lees .qn{color:#0E8F6A}
.lzgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.lzgrid .text{max-height:72vh;margin-top:0;position:sticky;top:12px}
.lzgrid .prompt{font-size:1.15rem;margin:12px 0 14px}
@media (max-width:820px){.lzgrid{grid-template-columns:1fr}.lzgrid .text{position:relative;top:auto;max-height:52vh}}
.text .an{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:7px;background:#F6E6A6;font:800 .8rem var(--display);margin-right:8px;vertical-align:1px}
.text .soort{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#8A6D00;margin-bottom:10px}
.text mark{background:#FFD95C;color:inherit;border-radius:4px;box-shadow:0 0 0 3px #FFD95C}
.newtext{border-radius:14px;background:#DDF6EC;color:#0B5A41;padding:10px 14px;font-weight:700;margin-bottom:14px;line-height:1.45}
.tipbtn{border:0;background:none;color:#0B6E4F;font:800 .95rem var(--body);cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.tipbox{margin-top:8px;border-radius:14px;background:#EEF9F4;border:2px solid #BFEBD7;padding:12px 14px;line-height:1.5;font-weight:600}
.tipbox b{display:block;font-family:var(--display);font-size:1.05rem;margin-bottom:2px}
.fb.retry{background:var(--warn-bg);color:#6E4300}
.fb .tipline{display:block;margin-top:8px;font-weight:600}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.skillbtn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit;color:var(--ink)}
.skillbtn:hover{border-color:var(--lees)} .skillbtn b{font-weight:800}
.skillbtn span{font-size:.85rem;color:var(--ink-2);font-weight:700}
.ri .ev{font-size:.9rem;margin-top:6px;background:#FFFBEA;border-left:4px solid #FFD95C;padding:6px 10px;border-radius:6px}
.sect{margin-top:26px;padding-top:20px;border-top:2px dashed var(--line)}
.bigbtn{position:relative;overflow:hidden;border:0;border-radius:32px;padding:28px 24px 26px;min-height:240px;color:#fff;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;
  box-shadow:0 10px 0 rgba(31,26,61,.25);transition:transform .15s, box-shadow .15s}
.bigbtn:hover{transform:translateY(-4px);box-shadow:0 14px 0 rgba(31,26,61,.25)}
.bigbtn:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(31,26,61,.25)}
.bigbtn.taal{background:linear-gradient(135deg,var(--taal),var(--taal-2))}
.bigbtn.reken{background:linear-gradient(135deg,var(--reken),var(--reken-2))}
.bigbtn .glyph{position:absolute;top:10px;right:18px;font:800 6.5rem/1 var(--display);opacity:.28;letter-spacing:-.04em}
.bigbtn .lbl{font:800 3rem/1 var(--display)}
.bigbtn .sub{font-weight:700;opacity:.95}
.qstrip{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.qpill{background:rgba(255,255,255,.25);border-radius:10px;padding:3px 9px;font:700 .82rem var(--body)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:13px 22px;font:800 1.05rem var(--body);cursor:pointer;background:var(--ink);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.ghost{background:var(--mist);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.taal{background:var(--taal)} .btn.reken{background:var(--reken-2)}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:18px}
.qcard{border:3px solid var(--line);border-radius:20px;padding:18px;background:var(--paper);display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s, transform .15s}
.qcard:hover{transform:translateY(-3px)}
.qcard .qn{font:800 2.4rem/1 var(--display)}
.qcard.taal:hover{border-color:var(--taal)} .qcard.reken:hover{border-color:var(--reken-2)}
.qcard.taal .qn{color:var(--taal)} .qcard.reken .qn{color:var(--reken-2)}
.best{margin-top:auto;font-weight:800;font-size:.9rem}
.seg{display:inline-flex;background:var(--mist);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:10px;padding:9px 14px;font:800 .95rem var(--body);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 2px 0 var(--line)}
/* test */
.testbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.prog{flex:1;min-width:140px;height:14px;border-radius:99px;background:rgba(255,255,255,.6);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--ink);transition:width .3s}
.tag{display:inline-block;border-radius:999px;padding:4px 12px;font:800 .78rem var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--mist);color:var(--ink-2)}
.tag.taal{background:#FFE5E9;color:#B8233A} .tag.reken{background:#E3EEFF;color:#2F3FC4}
.prompt{font-size:1.3rem;font-weight:700;line-height:1.45;margin:14px 0 18px}
.prompt .sum{font:800 1.7rem var(--display);white-space:nowrap}
.prompt .zin{display:block;margin-top:8px;padding:12px 16px;border-radius:14px;background:var(--mist);font-weight:700}
.prompt em{font-style:normal;background:var(--sun);padding:0 6px;border-radius:6px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-weight:800;margin:0 2px}
.frac span:first-child{border-bottom:2px solid currentColor;padding:0 3px 2px}
.frac span:last-child{padding-top:2px}
.text{max-height:46vh;overflow:auto;border-radius:16px;background:#FFFBEA;border:2px solid #F6E6A6;padding:16px 18px;line-height:1.7;font-size:1.02rem;margin-top:12px}
.text h4{margin:0 0 6px;font:800 1.15rem var(--display)}
.text p{margin:0 0 10px;max-width:68ch}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:3px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 14px;font:700 1.05rem var(--body);color:var(--ink);cursor:pointer}
.opt .k{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--mist);font:800 .95rem var(--display)}
.opt:hover{border-color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--mist)}
.opt[aria-pressed="true"] .k{background:var(--ink);color:#fff}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.ok .k{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-bg)} .opt.no .k{background:var(--bad);color:#fff}
.ansrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ansrow input{font:800 1.5rem var(--display);padding:10px 16px;border-radius:16px;border:3px solid var(--line);width:min(260px,100%);color:var(--ink);background:#fff}
.ansrow input:focus{border-color:var(--ink);outline:none}
.ansrow .unit{font:800 1.3rem var(--display);color:var(--ink-2)}
.hint{font-size:.88rem;color:var(--ink-2);margin-top:8px}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;font-weight:700;line-height:1.5}
.fb.ok{background:var(--good-bg);color:#0C6B45} .fb.no{background:var(--bad-bg);color:#9C1C30}
.fb strong{font-family:var(--display);font-size:1.25rem;display:block}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
svg text{font-family:var(--body);font-weight:700;fill:var(--ink)}
.fig{margin:6px 0 4px;max-width:100%;overflow-x:auto}
table.tt{border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:8px}
table.tt th,table.tt td{border:2px solid var(--line);padding:6px 12px;text-align:center}
table.tt th{background:var(--mist)}
/* results */
.resgrid{display:grid;grid-template-columns:240px 1fr;gap:22px;align-items:start}
@media (max-width:720px){.resgrid{grid-template-columns:1fr}}
.grade{display:grid;place-items:center;width:190px;height:190px;border-radius:50%;margin:0 auto;color:#fff;text-align:center}
.grade .g{font:800 4.4rem/1 var(--display)}
.grade small{font-weight:800;opacity:.9}
.pill{display:inline-block;border-radius:999px;padding:5px 12px;font:800 .85rem var(--body)}
.pill.good{background:var(--good-bg);color:#0C6B45} .pill.warn{background:var(--warn-bg);color:#8A5600} .pill.bad{background:var(--bad-bg);color:#9C1C30}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 54px;gap:10px;align-items:center;font-weight:700}
.bar .tr{height:14px;background:var(--mist);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.review{display:grid;gap:10px;margin-top:10px}
.ri{border-radius:14px;padding:12px 14px;border:2px solid var(--line);display:grid;grid-template-columns:34px 1fr;gap:10px}
.ri .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font:800 .9rem var(--display)}
.ri.ok .n{background:var(--good)} .ri.no .n{background:var(--bad)}
.ri .p{font-weight:700;min-width:0}
.ri .a{font-size:.93rem;margin-top:4px}
.ri .e{font-size:.9rem;color:var(--ink-2);margin-top:4px}
/* board */
.tablewrap{overflow-x:auto;margin-top:14px}
table.board{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;min-width:900px}
table.board th{font:800 .78rem var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);text-align:center;padding:8px 6px;border-bottom:2px solid var(--line)}
table.board th.l, table.board td.l{text-align:left}
table.board td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center;font-weight:700}
table.board tr.click{cursor:pointer} table.board tr.click:hover td{background:var(--mist)}
.sc{display:inline-block;min-width:44px;border-radius:10px;padding:4px 6px;font:800 .95rem var(--display)}
.sc.g{background:var(--good-bg);color:#0C6B45} .sc.w{background:var(--warn-bg);color:#8A5600} .sc.b{background:var(--bad-bg);color:#9C1C30} .sc.e{color:#B9B4D6}
th.grp{color:var(--ink)!important}
.who{display:flex;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--mist);border-radius:16px;padding:12px 14px}
.stat b{display:block;font:800 1.8rem var(--display)}
.stat span{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.hist{display:grid;gap:6px;margin-top:8px}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--mist);font-weight:700;font-size:.95rem}
/* modal */
.modal{position:fixed;inset:0;background:rgba(31,26,61,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:16px 0}
.utile{border:3px solid var(--line);border-radius:18px;background:#fff;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font:800 1rem var(--body);color:var(--ink)}
.utile[aria-pressed="true"]{border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
.field input{font:700 1.1rem var(--body);padding:11px 14px;border-radius:14px;border:3px solid var(--line)}
.field input:focus{border-color:var(--ink);outline:none}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
.store{font-size:.8rem;font-weight:700;color:var(--ink);background:rgba(255,255,255,.6);border-radius:999px;padding:4px 10px}
.empty{text-align:center;padding:30px 10px}
.confirm{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--bad-bg);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
</style>
</head>
<body>

<div class="confetti" aria-hidden="true" id="confetti"></div>
<div class="wrap">
  <header class="top">
    <button class="logo" id="homeBtn" type="button"><b>8</b>IEP Oefenplein</button>
    <span class="sp"></span>
    <span class="store" id="storeBadge">Laden…</span>
    <button class="chip plain" id="boardBtn" type="button">Voortgang</button>
    <button class="chip" id="userBtn" type="button"></button>
  </header>
  <main id="app"></main>
</div>
<div id="modalRoot"></div>

<script>
(() => {
"use strict";
/* ============ helpers ============ */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(x,d=6)=>Math.round(x*10**d)/10**d;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip=h=>String(h).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
function nf(n,d=3){n=rnd(n,d);const neg=n<0;n=Math.abs(n);let [i,f]=String(n).split(".");i=i.replace(/\B(?=(\d{3})+(?!\d))/g,".");return (neg?"−":"")+i+(f?","+f:"")}
const eur=n=>{const [i,f=""]=nf(n,2).split(",");return "€ "+i+","+(f+"00").slice(0,2)};
const dur=m=>{const h=Math.floor(m/60),r=m%60;return h&&r?`${h} uur en ${r} minuten`:h?`${h} uur`:`${r} minuten`};
const fr=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const hm=m=>{m=((m%1440)+1440)%1440;return Math.floor(m/60)+"."+String(m%60).padStart(2,"0")};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const comma=x=>String(x).replace(".",",");
function parseNums(s){
  s=String(s).trim().replace(/−/g,"-").replace(/\s/g,"").replace(/[^\d.,\-]/g,"");
  if(!s||s==="-")return [];
  const out=[];
  if(s.includes(",")){out.push(+s.replace(/\./g,"").replace(",","."))}
  else{out.push(+s);out.push(+s.replace(/\./g,""))}
  return out.filter(x=>Number.isFinite(x));
}
function parseFrac(s){
  s=String(s).trim().replace(/\s+/g," ");
  let m=s.match(/^(-?\d+) (\d+)\/(\d+)$/); if(m){const w=+m[1],n=+m[2],d=+m[3];if(!d)return null;return {n:w*d+n,d}}
  m=s.match(/^(-?\d+)\s?\/\s?(\d+)$/); if(m){if(!+m[2])return null;return {n:+m[1],d:+m[2]}}
  const v=parseNums(s); if(v.length) return {n:v[0],d:1};
  return null;
}
function parseTime(s){
  const m=String(s).trim().match(/^(\d{1,2})\s?[.:,u]\s?(\d{2})(\s?uur)?$/i); if(!m)return null;
  const h=+m[1],mi=+m[2]; if(h>23||mi>59)return null; return h*60+mi;
}

/* ============ REKENEN generators ============ */
const RK={};
RK.getallen=[
 q=>{ // optellen / aftrekken
  const d=[0,4,5,5,6][q]; const dec=q>=3&&Math.random()<.5;
  let a=R(10**(d-1),10**d-1), b=R(10**(d-2),10**d-1);
  if(dec){a/=100;b/=100}

 {lvl:4,t:"Bijen in de stad",p:["Steeds meer mensen zetten een bijenkast op hun dak of in hun tuin. Ze willen de bij helpen, want het gaat niet goed met veel bijensoorten. In Nederland leven ruim 350 soorten bijen. Ongeveer de helft daarvan staat op de Rode Lijst: de lijst van bedreigde soorten.","Toch zijn niet alle onderzoekers blij met al die bijenkasten. In de kasten wonen bijna altijd honingbijen. Die worden door imkers gehouden en zijn niet bedreigd. Wilde bijen, zoals de metselbij en de hommel, zoeken voedsel op dezelfde bloemen. Als er te veel honingbijen zijn, blijft er voor wilde bijen te weinig over. Wie wilde bijen echt wil helpen, kan daarom beter bloemen planten die laat in het seizoen bloeien en tegels uit de tuin halen. Volgens mij is dat ook nog eens veel mooier dan een grijze tuin."],

function poolBy(arr,q,lvlOf){
  const near=arr.filter(x=>lvlOf(x)<=q&&lvlOf(x)>=q-1); const all=arr.filter(x=>lvlOf(x)<=q);
  return near.length>=4?near:all;
}
function makeTaal(q){
  const items=[];
  // Lezen: 1 tekst (3 vragen) + 1 tekst (1 vraag) + 1 signaalwoord
  const tx=shuffle(poolBy(TEKSTEN,q,t=>t.lvl)).slice(0,2);
  const qsets=[shuffle(tx[0].v).slice(0,3),shuffle(tx[1]?tx[1].v:[]).slice(0,1)];
  tx.forEach((t,ti)=>qsets[ti].forEach(v=>{const opts=shuffle(v[1]);items.push({kind:"mc",cat:"Lezen",text:t,prompt:v[0],options:opts,answer:opts.indexOf(v[1][0]),explain:v[2]})}));
  const sg=shuffle(poolBy(SIGNAAL,q,s=>s[3])).slice(0,5-items.length);
  sg.forEach(s=>{const opts=shuffle([s[1],...s[2]]);items.push({kind:"mc",cat:"Lezen",prompt:`Welk signaalwoord past op de puntjes? <span class="zin">${s[0].replace("___","<em>…</em>")}</span>`,options:opts,answer:opts.indexOf(s[1]),explain:`'${s[1]}' past: het laat het goede verband tussen de zinsdelen zien.`})});
  // Werkwoordspelling 5
  const seen=new Set(); let guard=0;
  while(items.filter(i=>i.cat==="Werkwoordspelling").length<5&&guard++<60){const it=wwItem(q);if(seen.has(it.prompt))continue;seen.add(it.prompt);items.push(it)}
  // Spelling & interpunctie 4
  shuffle(poolBy(SPELL,q,s=>s[1])).slice(0,2).forEach(s=>{const opts=shuffle(s[0]);items.push({kind:"mc",cat:"Spelling & interpunctie",prompt:"Welk woord is goed geschreven?",options:opts,answer:opts.indexOf(s[0][0]),explain:`Goed is: ${s[0][0]}.`})});
  shuffle(poolBy(PUNCT,q,s=>s[1])).slice(0,2).forEach(s=>{const opts=shuffle(s[0]);items.push({kind:"mc",cat:"Spelling & interpunctie",prompt:"Welke zin is goed geschreven (hoofdletters en leestekens)?",options:opts,answer:opts.indexOf(s[0][0]),explain:s[2]})});
  // Grammatica 3
  const gs=new Set();guard=0;
  while(items.filter(i=>i.cat==="Grammatica").length<3&&guard++<40){const it=grammarItem(q);if(gs.has(it.prompt))continue;gs.add(it.prompt);if(it._cor){it.answer=it.options.indexOf(it._cor);delete it._cor}items.push(it)}
  // Woordenschat 3
  shuffle(poolBy(WOORDEN,q,w=>w[3])).slice(0,3).forEach(w=>{const opts=shuffle([w[1],...w[2]]);const idiom=w[0].includes(" ")&&w[0][0]===w[0][0].toUpperCase();
    items.push({kind:"mc",cat:"Woordenschat",prompt:idiom?`Wat betekent de uitdrukking <em>${w[0]}</em>?`:`Wat betekent <em>${w[0]}</em>?`,options:opts,answer:opts.indexOf(w[1]),explain:`'${w[0]}' betekent: ${w[1]}.`})});
  return items;
}

 v:[["zoek","Waarom gaan Bram en Noa niet terug om het klepje te zoeken?",["Dan komen ze te laat op school.","Het is te donker om te zoeken.","Noa wil niet terug.","Bram weet al waar het klepje ligt."],"Aan het eind van alinea 2 staat dat ze anders te laat zouden komen.","Als ze terug zouden gaan om het te zoeken, kwamen ze te laat."],
    ["verwijs","'Dat is vast bij de drempel gebeurd' (alinea 2). Waar verwijst 'Dat' naar?",["dat het batterijklepje weg is","dat het nog donker is","dat Noa iets riep","dat ze te laat komen"],"In de zin ervoor staat: 'Het batterijklepje was weg.' Dát is bij de drempel gebeurd.","Het batterijklepje was weg. 'Dat is vast bij de drempel gebeurd,'"],
    ["afleid","Wat voor iemand is Noa in dit verhaal?",["behulpzaam","ongeduldig","bang","boos"],"Noa bedenkt een oplossing zodat Bram toch veilig verder kan fietsen. Dat laat zien dat ze behulpzaam is.","'Fiets maar vlak achter mij,' zei Noa."],
    ["doel","Wat voor tekst is dit?",["een verhaal","een uitleg over fietslampjes","een reclame voor fietslampjes","een gebruiksaanwijzing"],"Er zijn personen (Bram, Noa, meester Tim), er gebeurt iets en ze praten met elkaar. Dat zijn kenmerken van een verhaal.",null]]},
{lvl:1,t:"Zo maak je een pindaslinger",soort:"instructie",p:[
 "In de winter kunnen vogels moeilijk voedsel vinden. Met een pindaslinger help je ze de koude dagen door. Je hebt nodig: een stevig touw van een meter, een grote naald, ongezouten pinda's in de dop en een schaar.",
 "Stap 1: Knip het touw af en maak aan één kant een dikke knoop. Stap 2: Steek de naald door het midden van een pinda en schuif hem tot aan de knoop. Stap 3: Rijg zo pinda na pinda aan het touw, tot je ongeveer twintig centimeter touw overhoudt.",
 "Stap 4: Hang de slinger aan een tak, op een plek waar katten niet bij kunnen. Gebruik nooit gezouten pinda's. Zout is slecht voor vogels. Binnen een paar dagen komen de eerste mezen al een kijkje nemen."],
 v:[["doel","Wat is het doel van deze tekst?",["uitleggen hoe je iets maakt","de lezer overtuigen om pinda's te kopen","een spannend verhaal vertellen","vertellen hoeveel vogels er zijn"],"De tekst geeft stappen (Stap 1, Stap 2 …). Een tekst met stappen wil je iets leren doen: dat is instrueren.",null],
    ["zoek","Wat doe je direct nadat je de knoop hebt gemaakt?",["Je steekt de naald door een pinda.","Je hangt de slinger aan een tak.","Je knipt het touw af.","Je haalt zout van de pinda's."],"De knoop is stap 1. Direct daarna komt stap 2: de naald door een pinda steken.","Stap 2: Steek de naald door het midden van een pinda"],
    ["verband","'Gebruik nooit gezouten pinda's. Zout is slecht voor vogels.' Wat is het verband tussen deze twee zinnen?",["De tweede zin geeft de reden.","De tweede zin is een tegenstelling.","De tweede zin is een voorbeeld.","De tweede zin vertelt wat er daarna gebeurt."],"Je kunt 'want' tussen de zinnen zetten: Gebruik nooit gezouten pinda's, want zout is slecht voor vogels. Dus de tweede zin is de reden.","Gebruik nooit gezouten pinda's. Zout is slecht voor vogels."],
    ["afleid","Waarom moet je de slinger ophangen waar katten niet bij kunnen?",["Katten kunnen de vogels vangen.","Katten eten de pinda's op.","Katten houden niet van touw.","Katten maken de tak kapot."],"Dat staat er niet letterlijk. Maar katten jagen op vogels. De vogels moeten veilig kunnen eten.","op een plek waar katten niet bij kunnen"]]},
{lvl:1,t:"Een week zonder scherm",soort:"column (mening)",p:[
 "Ik ben Jesse en ik zit in groep 8. Vorige maand deed onze klas mee aan een proef: een hele week geen telefoon en tablet na schooltijd. Eerst vond ik dat verschrikkelijk. Na drie dagen merkte ik iets geks: ik verveelde me minder dan ik dacht.",
 "Ik ging weer voetballen op het veldje en ik las in vier dagen een heel boek uit. Ook sliep ik beter. In onze klas zeiden vijftien van de vierentwintig kinderen dat ze beter sliepen.",
 "Daarom vind ik dat elk gezin één dag per week zonder scherm zou moeten houden. Het is niet makkelijk, maar je krijgt er echt iets voor terug. Probeer het gewoon eens!"],
 v:[["doel","Wat wil Jesse vooral met deze tekst?",["De lezer overtuigen om een dag zonder scherm te proberen.","Uitleggen hoe een tablet werkt.","Vertellen welk boek hij heeft gelezen.","De lezer laten lachen om zijn klas."],"In alinea 3 geeft Jesse zijn mening ('Daarom vind ik…') en roept hij de lezer op: 'Probeer het gewoon eens!' Dat is overtuigen.","Daarom vind ik dat elk gezin één dag per week zonder scherm zou moeten houden."],
    ["fm","Welke zin is een feit?",["In onze klas zeiden vijftien van de vierentwintig kinderen dat ze beter sliepen.","Het is niet makkelijk, maar je krijgt er echt iets voor terug.","Elk gezin zou één dag per week zonder scherm moeten houden.","Een dag zonder scherm is goed voor iedereen."],"Je kunt navragen hoeveel kinderen dat zeiden: dat is te controleren, dus een feit. De andere zinnen zijn wat iemand vindt.","In onze klas zeiden vijftien van de vierentwintig kinderen dat ze beter sliepen."],
    ["verwijs","'Eerst vond ik dat verschrikkelijk' (alinea 1). Wat vond Jesse verschrikkelijk?",["een week geen telefoon en tablet na schooltijd","dat hij in groep 8 zit","dat hij zich verveelde","voetballen op het veldje"],"Kijk in de zin ervoor: de proef was een hele week geen telefoon en tablet. Dát vond hij eerst verschrikkelijk.","een hele week geen telefoon en tablet na schooltijd. Eerst vond ik dat verschrikkelijk."],
    ["verband","Welk woord laat zien dat Jesse in alinea 3 een conclusie trekt uit zijn ervaringen?",["Daarom","maar","Ook","Eerst"],"'Daarom' betekent: om die reden. Jesse trekt een conclusie uit wat hij in alinea 1 en 2 heeft verteld.","Daarom vind ik"]]},
{lvl:1,t:"Hoe ontstaat een regenboog?",soort:"informatieve tekst",p:[
 "Een regenboog zie je alleen als het regent en de zon tegelijk schijnt. Dat lijkt vreemd, want meestal schijnt de zon niet als het regent. Daarom zie je een regenboog vaak aan het eind van een bui, wanneer de zon net weer doorbreekt.",
 "Zonlicht lijkt wit, maar het bestaat eigenlijk uit allemaal kleuren. Als het licht door een regendruppel gaat, buigt het een beetje af. Elke kleur buigt net iets anders. Daardoor worden de kleuren uit elkaar gehaald en zie je ze naast elkaar: van rood aan de bovenkant tot violet aan de onderkant.",
 "Wil je zelf een regenboog zien? Ga dan met je rug naar de zon staan en kijk naar de regen. Je kunt er ook zelf een maken: zet op een zonnige dag de tuinslang op een fijne straal."],
 v:[["hg","Waar gaat deze tekst vooral over?",["hoe een regenboog ontstaat en hoe je hem kunt zien","waarom het in Nederland vaak regent","hoe je een tuinslang gebruikt","welke kleur de mooiste is"],"Alinea 1 en 2 leggen uit hoe een regenboog ontstaat, alinea 3 hoe je hem kunt zien. De tuinslang is maar een klein stukje.",null],
    ["woord","'…wanneer de zon net weer doorbreekt' (alinea 1). Wat betekent 'doorbreekt' hier?",["tevoorschijn komt achter de wolken","kapotgaat","ondergaat","heel heet wordt"],"Aan het eind van een bui verdwijnen de wolken en komt de zon weer tevoorschijn.","wanneer de zon net weer doorbreekt"],
    ["verband","'Daardoor worden de kleuren uit elkaar gehaald' (alinea 2). Wat is de oorzaak?",["Elke kleur buigt net iets anders af.","Het regent heel hard.","De zon staat achter je.","Zonlicht is wit."],"'Daardoor' wijst terug naar de oorzaak in de zin ervoor: elke kleur buigt net iets anders.","Elke kleur buigt net iets anders. Daardoor worden de kleuren uit elkaar gehaald"],
    ["zoek","Hoe moet je staan om een regenboog te zien?",["met je rug naar de zon","met je gezicht naar de zon","onder een paraplu","zo hoog mogelijk"],"Het staat in alinea 3.","Ga dan met je rug naar de zon staan"]]},
/* ---------- NIVEAU 2 ---------- */
{lvl:2,t:"Wadlopen",soort:"informatieve tekst",p:[
 "De Waddenzee ligt in het noorden van Nederland, tussen het vasteland en de Waddeneilanden. Twee keer per dag stroomt het water weg. Dat heet eb. Daarna komt het water weer terug: vloed. Bij eb valt een groot deel van de zeebodem droog. Je kunt dan over de bodem lopen. Dat noemen we wadlopen.",
 "Wadlopen is spannend, maar ook gevaarlijk. Het water komt sneller terug dan je denkt, en op het wad zijn diepe geulen. Ook kan het plotseling mistig worden. Daarom mag je alleen met een gids het wad op. Een gids kent de route en weet precies hoe laat het water terugkomt.",
 "Tijdens een tocht zie je van alles. Op de bodem liggen kleine hoopjes zand, als slierten spaghetti. Die worden gemaakt door de wadpier, een worm die in de bodem leeft. Met wat geluk zie je in de verte zeehonden op een zandplaat liggen.",
 "De Waddenzee is zo bijzonder dat hij sinds 2009 op de Werelderfgoedlijst van UNESCO staat. Dat betekent dat het gebied extra goed beschermd moet worden."],
 v:[["verband","'Daarom mag je alleen met een gids het wad op' (alinea 2). Waarom?",["Wadlopen kan gevaarlijk zijn door het water, de geulen en de mist.","Een gids kan zeehonden vinden.","De Waddenzee staat op de Werelderfgoedlijst.","Er liggen hoopjes zand op de bodem."],"'Daarom' wijst terug naar de zinnen ervoor: daar staan de gevaren.","Het water komt sneller terug dan je denkt, en op het wad zijn diepe geulen."],
    ["verwijs","'Die worden gemaakt door de wadpier' (alinea 3). Waar verwijst 'Die' naar?",["de kleine hoopjes zand","de zeehonden","de geulen","de gidsen"],"In de zin ervoor staan 'kleine hoopjes zand'. Die worden door de wadpier gemaakt.","Op de bodem liggen kleine hoopjes zand, als slierten spaghetti. Die worden gemaakt door de wadpier"],
    ["opbouw","Waar gaat alinea 2 over?",["over de gevaren en waarom je een gids nodig hebt","over wat je ziet tijdens een tocht","over wat eb en vloed is","over waarom het gebied beschermd wordt"],"Alinea 2 begint met 'Wadlopen is spannend, maar ook gevaarlijk' en legt daarna uit waarom je een gids nodig hebt.",null],
    ["woord","'…dat het gebied extra goed beschermd moet worden' (alinea 4). Wat betekent 'beschermd'?",["Er wordt goed voor gezorgd, zodat het niet beschadigd raakt.","Er mag nooit meer iemand komen.","Het wordt groter gemaakt.","Er worden huizen gebouwd."],"Het gebied is bijzonder. Daarom moet ervoor gezorgd worden dat het niet kapotgaat: het wordt beschermd.","extra goed beschermd moet worden"]]},
{lvl:2,t:"Het dakje van opa",soort:"verhaal",p:[
 "Sinds opa met pensioen is, brengt hij elke dag uren door in zijn moestuin. Lieke helpt hem op woensdagmiddag. Ze vindt het heerlijk om te wieden, ook al krijgt ze er altijd zwarte nagels van.",
 "Deze woensdag was opa stiller dan anders. Hij stond bij het bed met tomaten en keek naar de bladeren. Ze hadden bruine vlekken. 'Het heeft te veel geregend,' mompelde hij. 'Als ik niet oppas, ben ik ze allemaal kwijt.'",
 "Lieke dacht na. In de klas hadden ze een filmpje gezien over een kas van plastic. 'Opa, kunnen we niet een dak boven de tomaten bouwen?' vroeg ze. Opa keek haar aan. Toen verscheen er een glimlach op zijn gezicht. 'Jij bent slimmer dan je opa,' zei hij. 'In de schuur ligt nog een oud golfplaatje.'",
 "De rest van de middag zaagden en timmerden ze. Toen Liekes moeder haar kwam ophalen, stond er een scheef, maar stevig dakje boven de tomaten."],
 v:[["afleid","Waarom is opa deze woensdag 'stiller dan anders'?",["Hij maakt zich zorgen om zijn tomaten.","Hij is moe van het wieden.","Hij is boos op Lieke.","Hij heeft keelpijn."],"Direct daarna kijkt hij naar de bruine vlekken en zegt hij dat hij de tomaten kan kwijtraken. Hij maakt zich zorgen.","Deze woensdag was opa stiller dan anders."],
    ["verband","'Ze vindt het heerlijk om te wieden, ook al krijgt ze er altijd zwarte nagels van.' Welk verband geeft 'ook al'?",["een tegenstelling","een oorzaak","een voorbeeld","een tijdsvolgorde"],"Iets leuks (wieden is heerlijk) en iets minder leuks (zwarte nagels) staan tegenover elkaar. 'Ook al' geeft een tegenstelling, net als 'maar'.","ook al krijgt ze er altijd zwarte nagels van"],
    ["zoek","Waar haalde Lieke het idee voor het dakje vandaan?",["uit een filmpje dat ze in de klas had gezien","uit een boek van opa","van haar moeder","uit de schuur"],"Het staat aan het begin van alinea 3.","In de klas hadden ze een filmpje gezien over een kas van plastic."],
    ["woord","Wat betekent 'wieden' (alinea 1)?",["onkruid weghalen","water geven","zaadjes planten","groente plukken"],"Bij wieden trek je onkruid uit de grond. Daarom krijgt Lieke er zwarte nagels van.","om te wieden"]]},
{lvl:2,t:"Zwembad De Golf weer open",soort:"informatieve tekst met tabel",p:[
 "Zwembad De Golf in Veenhorst is na een grote verbouwing weer open. Er is een nieuw golfslagbad en een glijbaan van 40 meter. In het ondiepe bad is een speciaal deel voor kinderen tot zes jaar.",
 {table:[["Dag","Vrij zwemmen","Banenzwemmen"],["maandag","14.00–17.00","07.00–09.00"],["woensdag","13.00–18.00","07.00–09.00"],["vrijdag","15.00–21.30","–"],["zaterdag","10.00–16.00","08.00–10.00"],["zondag","11.00–16.00","–"]],cap:"Openingstijden (niet in de schoolvakanties)"},
 "Een los kaartje kost € 6,50. Kinderen tot en met 12 jaar betalen € 4,50. Wie vaak komt, kan beter een tienbadenkaart kopen: die kost € 40,00 voor volwassenen en € 30,00 voor kinderen. Let op: in de schoolvakanties gelden andere tijden. Kijk daarvoor op de website."],
 v:[["zoek","Op welke dag kun je het langst vrij zwemmen?",["vrijdag","zaterdag","woensdag","zondag"],"Reken het per dag uit: vrijdag 15.00–21.30 is 6,5 uur. Zaterdag 6 uur, woensdag 5 uur, zondag 5 uur.",null],
    ["zoek","Sem is 11 jaar en wil tien keer gaan zwemmen. Hoeveel geld bespaart hij met een tienbadenkaart?",["€ 15,00","€ 5,00","€ 10,00","€ 25,00"],"Tien losse kinderkaartjes: 10 × € 4,50 = € 45,00. De tienbadenkaart voor kinderen kost € 30,00. € 45,00 − € 30,00 = € 15,00.","Kinderen tot en met 12 jaar betalen € 4,50."],
    ["afleid","Mila wil in de kerstvakantie op maandag om 15.00 uur gaan zwemmen. Wat kan ze het beste eerst doen?",["op de website kijken wat de tijden in de vakantie zijn","niets, want op maandag is het open van 14.00 tot 17.00","een tienbadenkaart kopen","naar het kinderbad gaan"],"De tabel geldt niet in de schoolvakanties. De kerstvakantie is een schoolvakantie, dus moet ze op de website kijken.","Let op: in de schoolvakanties gelden andere tijden."],
    ["doel","Wat is het doel van deze tekst?",["informeren over het zwembad","een spannend verhaal vertellen","uitleggen hoe je moet zwemmen","de mening van de badmeester geven"],"De tekst geeft informatie: wat er nieuw is, de openingstijden en de prijzen.",null]]},
{lvl:2,t:"Interview: Fenna, jeugdkampioen schaken",soort:"interview",p:[
 "Fenna van Dijk (12) werd dit jaar Nederlands jeugdkampioen schaken in haar leeftijdsgroep. We vroegen haar hoe ze dat voor elkaar kreeg.",
 "Hoe ben je begonnen met schaken? 'Toen ik zes was, lag ik met een gebroken been op de bank. Mijn oma kwam elke dag langs met een schaakbord. Eerst won zij altijd, maar na een paar weken niet meer. Toen was ik verkocht.'",
 "Hoeveel train je? 'Op dinsdag en vrijdag ga ik naar de schaakclub. Thuis los ik elke dag een paar puzzels op. Dat zijn stellingen waarin je de beste zet moet vinden. Het is net als met piano spelen: je wordt alleen beter als je vaak oefent.'",
 "Wat vind je het moeilijkste? 'Verliezen. Vroeger moest ik dan huilen. Nu kijk ik samen met mijn trainer waar het misging. Van een verloren partij leer je eigenlijk meer dan van een gewonnen partij.'"],
 v:[["woord","'Toen was ik verkocht' (alinea 2). Wat bedoelt Fenna?",["Toen vond ze schaken heel leuk.","Toen had oma het schaakbord verkocht.","Toen moest ze naar het ziekenhuis.","Toen wilde ze stoppen met schaken."],"'Verkocht zijn' is een uitdrukking: je bent helemaal enthousiast over iets. Fenna begon te winnen en vond schaken vanaf toen geweldig.","Toen was ik verkocht."],
    ["verwijs","'Dat zijn stellingen waarin je de beste zet moet vinden' (alinea 3). Waar verwijst 'Dat' naar?",["de puzzels","de schaakclub","de trainingen op dinsdag en vrijdag","het piano spelen"],"In de zin ervoor staat: 'Thuis los ik elke dag een paar puzzels op.' Die puzzels zijn stellingen.","Thuis los ik elke dag een paar puzzels op. Dat zijn stellingen"],
    ["verband","Waarom vergelijkt Fenna schaken met piano spelen?",["Om te laten zien dat je vaak moet oefenen om beter te worden.","Omdat ze ook piano speelt.","Omdat oma piano speelt.","Om te laten zien dat schaken saai is."],"Ze zegt erbij: 'je wordt alleen beter als je vaak oefent.' Dat is het punt van de vergelijking.","Het is net als met piano spelen: je wordt alleen beter als je vaak oefent."],
    ["fm","Welke zin is een mening van Fenna?",["Van een verloren partij leer je eigenlijk meer dan van een gewonnen partij.","Op dinsdag en vrijdag ga ik naar de schaakclub.","Toen ik zes was, lag ik met een gebroken been op de bank.","Mijn oma kwam elke dag langs met een schaakbord."],"Of je meer leert van verliezen, is wat Fenna vindt. De andere zinnen vertellen wat er echt gebeurde: die kun je controleren.","Van een verloren partij leer je eigenlijk meer dan van een gewonnen partij."],
    ["hg","Wat is de belangrijkste boodschap van dit interview?",["Fenna werd kampioen doordat ze veel oefent en leert van haar fouten.","Fenna brak haar been toen ze zes was.","Oma won vroeger altijd van Fenna.","Schaken is alleen voor slimme kinderen."],"Het gebroken been en oma zijn details uit het begin. Het interview gaat over hoe ze kampioen werd: veel oefenen en leren van verlies.",null]]},
{lvl:2,t:"Groen schoolplein in Hengelo",soort:"nieuwsbericht",p:[
 "Basisschool De Regenboog in Hengelo heeft een nieuw schoolplein. Waar vroeger grijze tegels lagen, staan nu bomen, struiken en een heuvel met gras. Er is ook een moestuin en een plek waar het regenwater in de grond kan zakken.",
 "Het idee kwam van de leerlingenraad. 'Op warme dagen was het plein veel te heet,' vertelt Daan (11) uit groep 8. 'En als het hard regende, stond alles blank.' Een groen plein blijft koeler, omdat planten en bomen schaduw geven en water vasthouden.",
 "Niet iedereen was meteen enthousiast. Sommige ouders waren bang dat hun kinderen vaker met modderige kleren thuis zouden komen. De school heeft daarom laarzen gekocht die kinderen in de pauze kunnen aantrekken.",
 "De gemeente heeft de helft van de kosten betaald. Volgens wethouder Bakker krijgen volgend jaar nog vijf scholen in de stad een groen plein."],
 v:[["opbouw","Welke titel past ook goed bij deze tekst?",["Nieuw groen schoolplein blijft koeler en droger","Kinderen werken in de moestuin","Ouders boos op de school","Wethouder koopt laarzen"],"Een goede titel past bij de hele tekst. De andere titels gaan over een klein stukje, of kloppen niet.",null],
    ["verband","'Een groen plein blijft koeler, omdat planten en bomen schaduw geven en water vasthouden.' Wat staat er na 'omdat'?",["de reden waarom een groen plein koeler blijft","een tegenstelling","een voorbeeld van een plant","wat er daarna gebeurt"],"Na 'omdat' komt altijd een reden.","Een groen plein blijft koeler, omdat planten en bomen schaduw geven en water vasthouden."],
    ["woord","'…stond alles blank' (alinea 2). Wat betekent 'blank' hier?",["onder water","wit","schoon","leeg"],"Het gaat over hard regenen. Als alles blank staat, staat alles onder water.","stond alles blank"],
    ["verband","Waarom heeft de school laarzen gekocht?",["Sommige ouders waren bang voor modderige kleren.","Het plein was te heet.","De gemeente wilde dat.","De kinderen werken in de moestuin."],"'Daarom' in alinea 3 wijst terug naar de zin ervoor: ouders waren bang voor modderige kleren.","Sommige ouders waren bang dat hun kinderen vaker met modderige kleren thuis zouden komen."]]},
/* ---------- NIVEAU 3 ---------- */
{lvl:3,t:"Plastic in zee",soort:"informatieve tekst",p:[
 "Plastic is handig. Het is licht, sterk en goedkoop. Juist daardoor is het ook een probleem. Een plastic flesje dat in zee belandt, verdwijnt niet. Het kan honderden jaren blijven drijven.",
 "Hoe komt plastic in zee? Een deel wordt achteloos weggegooid op het strand. Veel meer plastic komt via rivieren in zee terecht. Een zakje dat in Duitsland in de Rijn waait, kan zo weken later voor de kust van Nederland drijven.",
 "In zee breekt plastic door de zon en de golven in steeds kleinere stukjes. Uiteindelijk zijn die zo klein dat je ze bijna niet meer ziet. Dit noemen we microplastics. Vissen en vogels zien de stukjes aan voor voedsel. Ze krijgen een vol gevoel in hun maag, maar ze krijgen geen voedingsstoffen binnen. Sommige dieren gaan daardoor dood.",
 "Er zijn mensen die plastic uit zee proberen te vissen. Dat helpt, maar het is dweilen met de kraan open zolang er elke dag nieuw plastic bij komt. Belangrijker is dat we minder plastic gebruiken en het niet laten rondslingeren. Een hervulbare fles is daarvoor een simpel begin."],
 v:[["verwijs","'Juist daardoor is het ook een probleem' (alinea 1). Waar verwijst 'daardoor' naar?",["doordat plastic licht, sterk en goedkoop is","doordat plastic in zee belandt","doordat plastic honderden jaren drijft","doordat plastic in rivieren waait"],"Lees de zin ervoor: 'Het is licht, sterk en goedkoop.' Juist dáárdoor gebruiken we veel plastic en verdwijnt het niet.","Het is licht, sterk en goedkoop. Juist daardoor is het ook een probleem."],
    ["woord","'…het is dweilen met de kraan open' (alinea 4). Wat bedoelt de schrijver?",["Opruimen helpt weinig zolang er steeds nieuw plastic bij komt.","Je moet de zee schoonmaken met een dweil.","Het water in zee stijgt.","Plastic opruimen gaat heel snel."],"Als de kraan openstaat, kun je blijven dweilen: het wordt nooit droog. Zo helpt opruimen weinig zolang er elke dag nieuw plastic bij komt.","het is dweilen met de kraan open zolang er elke dag nieuw plastic bij komt"],
    ["verband","Waarom gaan sommige vissen en vogels dood door microplastics?",["Ze voelen zich vol, maar krijgen geen voedingsstoffen binnen.","Ze raken verstrikt in grote flessen.","Ze worden gevangen in visnetten.","Het water wordt te warm."],"'Daardoor' in de laatste zin van alinea 3 wijst naar de oorzaak in de zin ervoor.","Ze krijgen een vol gevoel in hun maag, maar ze krijgen geen voedingsstoffen binnen."],
    ["fm","Welke zin is een mening van de schrijver?",["Belangrijker is dat we minder plastic gebruiken en het niet laten rondslingeren.","Veel meer plastic komt via rivieren in zee terecht.","In zee breekt plastic door de zon en de golven in steeds kleinere stukjes.","Vissen en vogels zien de stukjes aan voor voedsel."],"'Belangrijker is…' geeft aan wat de schrijver het belangrijkst vindt: een mening. De andere zinnen zijn feiten die onderzoekers kunnen controleren.","Belangrijker is dat we minder plastic gebruiken en het niet laten rondslingeren."],
    ["hg","Wat is de hoofdgedachte van deze tekst?",["Plastic in zee is een groot probleem; minder plastic gebruiken helpt het meest.","Via de Rijn komt plastic uit Duitsland naar Nederland.","Plastic is licht, sterk en goedkoop.","Er zijn mensen die plastic uit zee vissen."],"De andere antwoorden zijn details uit één alinea. De hoofdgedachte vat de hele tekst samen: het probleem (alinea 1–3) en de beste oplossing (alinea 4).",null]]},
{lvl:3,t:"Het schoolkamp",soort:"verhaal",p:[
 "Iedereen in groep 8 had zich verheugd op het schoolkamp. Iedereen, behalve Ravi. Al weken lag er een briefje met de paklijst op zijn bureau. Hij had er nog niets van afgestreept.",
 "'Heb je je slaapzak al?' vroeg zijn moeder op zondagavond. Ravi haalde zijn schouders op. 'Misschien ben ik woensdag wel ziek,' zei hij. Zijn moeder ging naast hem op bed zitten. 'Is het vanwege het slapen?' vroeg ze zacht. Ravi knikte. Hij had nog nooit ergens anders geslapen dan thuis, en zijn knuffelaap ging altijd mee naar bed. Wat zouden de anderen wel niet zeggen?",
 "Op woensdag stond Ravi toch bij de bus, met zijn tas stijf tegen zich aan geklemd. 's Avonds in de slaapzaal kroop hij als eerste in zijn slaapzak, zodat niemand zag wat hij erin had verstopt. Toen het licht uitging, hoorde hij naast zich geritsel. 'Psst, Ravi,' fluisterde Thijs, de stoerste jongen van de klas. 'Niet verder vertellen, hoor.' In het schemerlicht zag Ravi een versleten knuffelhond.",
 "Ravi grinnikte. Voor het eerst die week voelde zijn buik niet als een knoop."],
 v:[["afleid","Waarom heeft Ravi nog niets van de paklijst afgestreept?",["Hij ziet op tegen het kamp.","Hij is de lijst kwijt.","Hij heeft al alles ingepakt.","Zijn moeder pakt altijd voor hem in."],"Iedereen verheugt zich, 'behalve Ravi'. En hij hoopt dat hij ziek is. Hij ziet er dus tegen op.","Hij had er nog niets van afgestreept."],
    ["afleid","Wat heeft Ravi in zijn slaapzak verstopt?",["zijn knuffelaap","zijn paklijst","een zaklamp","snoep"],"Het staat er niet letterlijk. In alinea 2 lees je dat zijn knuffelaap altijd mee naar bed gaat en dat hij bang is voor wat de anderen zeggen.","zodat niemand zag wat hij erin had verstopt"],
    ["woord","'Voor het eerst die week voelde zijn buik niet als een knoop' (alinea 4). Wat betekent dit?",["Hij was niet meer zo zenuwachtig.","Hij had geen honger meer.","Hij had buikpijn van het eten.","Hij was boos op Thijs."],"Een buik als een knoop is beeldspraak voor zenuwen. Nu voelt hij zich opgelucht.","Voor het eerst die week voelde zijn buik niet als een knoop."],
    ["afleid","Waarom is het belangrijk dat juist Thijs een knuffel bij zich heeft?",["Ravi ziet dat zelfs de stoerste jongen er een heeft, dus hij hoeft zich niet te schamen.","Thijs wil de knuffel van Ravi afpakken.","Thijs is bang in het donker.","Thijs is de beste vriend van Ravi."],"De schrijver noemt Thijs 'de stoerste jongen van de klas'. Als zelfs hij een knuffel heeft, is het niet gek.","fluisterde Thijs, de stoerste jongen van de klas."]]},
{lvl:3,t:"Moet de zomervakantie korter?",soort:"betoog",p:[
 "In Nederland duurt de zomervakantie op de basisschool zes weken. Sommige onderwijsdeskundigen willen die vakantie inkorten tot vier weken. De twee weken die overblijven, willen ze verdelen over de rest van het jaar.",
 "Voorstanders zeggen dat kinderen in zes weken veel vergeten. Na de zomer moeten leerkrachten eerst herhalen wat de klas voor de vakantie al kon. Vooral bij rekenen en lezen zou dat goed te merken zijn. Met kortere vakanties en vaker een weekje vrij zouden kinderen bovendien minder moe worden.",
 "Tegenstanders vinden dat kinderen juist een lange vakantie nodig hebben om echt tot rust te komen. Daarnaast wijzen ze erop dat veel gezinnen in de zomer op reis gaan. Als de vakantie korter wordt, kunnen zij minder ver weg. Ook bedrijven die van toeristen afhankelijk zijn, zoals campings, zouden er last van hebben.",
 "Ik denk dat beide kanten een punt hebben. Toch zou ik kiezen voor vijf weken zomervakantie. Dan is er genoeg tijd om uit te rusten, en vergeten kinderen waarschijnlijk minder dan na zes weken."],
 v:[["opbouw","Wat staat er in alinea 3?",["argumenten tegen een kortere zomervakantie","argumenten voor een kortere zomervakantie","de mening van de schrijver","hoe lang de vakantie nu duurt"],"Alinea 3 begint met 'Tegenstanders vinden…'. Daarna volgen hun argumenten.",null],
    ["fm","Welke zin is een mening?",["Toch zou ik kiezen voor vijf weken zomervakantie.","In Nederland duurt de zomervakantie op de basisschool zes weken.","Sommige onderwijsdeskundigen willen die vakantie inkorten tot vier weken.","Veel gezinnen gaan in de zomer op reis."],"'Ik zou kiezen' is wat de schrijver vindt. De andere zinnen kun je controleren.","Toch zou ik kiezen voor vijf weken zomervakantie."],
    ["verband","'Daarnaast wijzen ze erop…' (alinea 3). Welk verband geeft 'Daarnaast'?",["een opsomming: er komt nog een argument bij","een tegenstelling","een conclusie","een tijdsvolgorde"],"'Daarnaast' betekent 'en ook nog'. Het voegt een tweede argument toe.","Daarnaast wijzen ze erop"],
    ["afleid","Welk argument van de vóórstanders gebruikt de schrijver in zijn eigen mening?",["dat kinderen na een lange vakantie veel vergeten","dat gezinnen ver weg op reis kunnen","dat campings er last van krijgen","dat kinderen tijd nodig hebben om tot rust te komen"],"'Tot rust komen' is een argument van de tegenstanders. Het argument 'vergeten' komt van de voorstanders (alinea 2) en staat ook in alinea 4.","en vergeten kinderen waarschijnlijk minder dan na zes weken"]]},
{lvl:3,t:"Het geheim van de trekvogels",soort:"informatieve tekst",p:[
 "Elk najaar vertrekken miljoenen vogels uit Nederland naar het zuiden. Ze vliegen naar landen waar het in de winter warmer is en waar ze genoeg voedsel kunnen vinden. In het voorjaar komen ze terug om hier te broeden. Deze vogels noemen we trekvogels.",
 "Sommige trekvogels leggen enorme afstanden af. De noordse stern is daarvan het bekendste voorbeeld. Deze kleine zeevogel vliegt elk jaar van het noordpoolgebied naar het zuidpoolgebied en weer terug. Dat is ongeveer 70.000 kilometer: bijna twee keer rond de aarde.",
 "Lang was het een raadsel hoe trekvogels de weg vinden. Inmiddels weten wetenschappers dat ze verschillende hulpmiddelen gebruiken. Overdag letten ze op de stand van de zon. 's Nachts gebruiken veel soorten de sterren. Daarnaast kunnen vogels het magnetisch veld van de aarde voelen. Dat werkt als een soort ingebouwd kompas.",
 "Toch gaat het niet altijd goed. Door het veranderende klimaat zijn er in het voorjaar soms al minder insecten wanneer de vogels terugkomen. De grutto, die in Afrika overwintert, heeft het daarnaast moeilijk doordat er in Nederland minder bloemrijke weilanden zijn. Daar vinden de jonge vogels juist hun voedsel."],
 v:[["verwijs","'Daar vinden de jonge vogels juist hun voedsel' (alinea 4). Waar verwijst 'Daar' naar?",["de bloemrijke weilanden","Afrika","het zuidpoolgebied","de landen waar het warmer is"],"Kijk wat er vlak vóór 'Daar' staat: 'minder bloemrijke weilanden'.","minder bloemrijke weilanden zijn. Daar vinden de jonge vogels juist hun voedsel."],
    ["verwijs","'Dat werkt als een soort ingebouwd kompas' (alinea 3). Wat werkt als een kompas?",["het voelen van het magnetisch veld van de aarde","de stand van de zon","de sterren","de noordse stern"],"'Dat' wijst naar de zin ervoor: vogels kunnen het magnetisch veld van de aarde voelen.","het magnetisch veld van de aarde voelen. Dat werkt als een soort ingebouwd kompas."],
    ["opbouw","Waarom noemt de schrijver de noordse stern in alinea 2?",["als voorbeeld van een vogel die een enorme afstand aflegt","als oorzaak van de vogeltrek","als tegenstelling met alinea 1","als conclusie van de hele tekst"],"Er staat letterlijk: 'daarvan het bekendste voorbeeld'.","De noordse stern is daarvan het bekendste voorbeeld."],
    ["woord","'Lang was het een raadsel…' (alinea 3). Wat betekent 'raadsel' hier?",["iets wat men niet kon verklaren","een grap","een spelletje","een gevaar"],"In de zin erna staat 'Inmiddels weten wetenschappers…'. Vroeger wisten ze het dus niet: het was een raadsel.","Lang was het een raadsel hoe trekvogels de weg vinden."]]},
{lvl:3,t:"Een klachtbrief",soort:"zakelijke brief",p:[
 "Beste medewerker van SpeelMaar,",
 "Op 3 maart heb ik bij uw webwinkel een bordspel besteld: 'Schatten van de Zee', voor € 29,95. Op de website stond dat het binnen twee werkdagen bezorgd zou worden. Het pakket kwam pas na negen dagen. Erger nog: toen ik de doos openmaakte, bleken er vier speelstukken te ontbreken.",
 "Ik had het spel gekocht als verjaardagscadeau voor mijn broertje. Hij was erg teleurgesteld, want we konden het niet spelen. Ik heb u op 14 maart al een e-mail gestuurd, maar daarop heb ik nog geen antwoord gekregen.",
 "Ik wil u vragen om mij zo snel mogelijk de ontbrekende speelstukken op te sturen. Als dat niet kan, wil ik graag mijn geld terug. Ik hoop binnen een week van u te horen.",
 "Met vriendelijke groet,<br>Yara Bos"],
 v:[["doel","Waarom schrijft Yara deze brief?",["Ze wil dat de winkel haar probleem oplost.","Ze wil een nieuw spel bestellen.","Ze wil de winkel bedanken.","Ze wil uitleggen hoe het spel werkt."],"In alinea 4 vraagt ze om de speelstukken of haar geld terug. Dat is het doel van een klachtbrief.","Ik wil u vragen om mij zo snel mogelijk de ontbrekende speelstukken op te sturen."],
    ["zoek","Welk tweede probleem noemt Yara, naast de late bezorging?",["Er ontbreken vier speelstukken.","Het spel was te duur.","Het spel was kapot.","Haar broertje vond het spel niet leuk."],"Na 'Erger nog:' komt het tweede probleem.","bleken er vier speelstukken te ontbreken"],
    ["verband","Wat laat Yara zien met de woorden 'Erger nog:' (alinea 2)?",["Dat er een probleem volgt dat nog vervelender is.","Dat het probleem is opgelost.","Dat ze een voorbeeld geeft.","Dat ze een conclusie trekt."],"'Erger nog' kondigt aan dat er iets komt wat nog vervelender is dan het eerste probleem.","Erger nog:"],
    ["afleid","Waarom vertelt Yara dat ze op 14 maart al een e-mail stuurde?",["Om te laten zien dat ze al eerder contact zocht en geen antwoord kreeg.","Om te laten weten wanneer haar broertje jarig was.","Om te vertellen wanneer het pakket kwam.","Om de winkel te bedanken voor het snelle antwoord."],"Ze laat zien dat de winkel nog niet heeft gereageerd. Zo maakt ze haar klacht sterker.","Ik heb u op 14 maart al een e-mail gestuurd, maar daarop heb ik nog geen antwoord gekregen."]]},
/* ---------- NIVEAU 4 ---------- */
{lvl:4,t:"Waarom we liegen",soort:"informatieve tekst",p:[
 "Iedereen liegt weleens. Je zegt dat je een cadeau mooi vindt, terwijl je het eigenlijk lelijk vindt. Of je vertelt je moeder dat je huiswerk al af is, terwijl je nog moet beginnen. Onderzoekers hebben ontdekt dat de meeste kinderen al rond hun derde jaar beginnen met liegen.",
 "Dat klinkt misschien slecht, maar volgens psychologen is het eerste leugentje juist een teken van ontwikkeling. Om te kunnen liegen, moet je namelijk begrijpen dat een ander iets anders weet dan jij. Een peuter die zegt dat hij het koekje niet heeft gepakt, snapt dat zijn moeder niet in zijn hoofd kan kijken.",
 "Niet elke leugen is hetzelfde. Een leugen om jezelf uit de problemen te praten, noemen we een eigenbelangleugen. Een leugen om een ander niet te kwetsen, heet een leugentje om bestwil. De meeste mensen vinden die tweede soort minder erg. Toch kan ook een leugentje om bestwil schade doen: als je vriendin steeds hoort dat haar tekeningen prachtig zijn, weet ze nooit wat ze beter kan doen.",
 "Liegen kost bovendien moeite. Wie liegt, moet onthouden wat hij heeft gezegd en tegen wie. Daardoor raken leugenaars vaak verstrikt in hun eigen verhaal. Eén leugen leidt dan tot de volgende.",
 "Wat helpt er tegen liegen? Volgens deskundigen helpt het als ouders en leerkrachten niet te boos reageren wanneer een kind eerlijk vertelt over iets wat fout ging. Wie weet dat eerlijkheid niet bestraft wordt, heeft minder reden om te liegen."],
 v:[["hg","Wat is de hoofdgedachte van deze tekst?",["Liegen hoort bij de ontwikkeling, maar heeft nadelen; eerlijkheid niet bestraffen helpt.","Kinderen beginnen rond hun derde jaar met liegen.","Een leugentje om bestwil is nooit erg.","Een peuter kan niet in het hoofd van zijn moeder kijken."],"Antwoord 2 en 4 zijn details. Antwoord 3 klopt niet met alinea 3. Het eerste antwoord vat de hele tekst samen.",null],
    ["afleid","Waarom is het eerste leugentje volgens psychologen 'een teken van ontwikkeling' (alinea 2)?",["Het kind begrijpt dan dat een ander niet weet wat het zelf weet.","Het kind heeft geleerd om koekjes te pakken.","Het kind wil zijn moeder boos maken.","Het kind kan dan beter praten."],"Het woord 'namelijk' geeft de uitleg: om te liegen moet je begrijpen dat een ander iets anders weet dan jij.","Om te kunnen liegen, moet je namelijk begrijpen dat een ander iets anders weet dan jij."],
    ["verwijs","'De meeste mensen vinden die tweede soort minder erg' (alinea 3). Wat is 'die tweede soort'?",["het leugentje om bestwil","de eigenbelangleugen","de leugen van een peuter","een leugen over huiswerk"],"In alinea 3 worden twee soorten genoemd. De eerste is de eigenbelangleugen, de tweede het leugentje om bestwil.","Een leugen om een ander niet te kwetsen, heet een leugentje om bestwil. De meeste mensen vinden die tweede soort minder erg."],
    ["woord","'…raken leugenaars vaak verstrikt in hun eigen verhaal' (alinea 4). Wat betekent 'verstrikt raken' hier?",["vast komen te zitten, zodat je er moeilijk uitkomt","heel goed worden in verhalen vertellen","je verhaal helemaal vergeten","snel ontdekt worden door de politie"],"Lees de zinnen eromheen: je moet alles onthouden en één leugen leidt tot de volgende. Je komt er steeds moeilijker uit.","Daardoor raken leugenaars vaak verstrikt in hun eigen verhaal."]]},
{lvl:4,t:"Van loopfiets tot veiligheidsfiets",soort:"informatieve tekst",p:[
 "Nederland heeft meer fietsen dan inwoners. Toch is de fiets geen Nederlandse uitvinding. Het begon in 1817 in Duitsland. Daar bouwde Karl Drais een houten loopfiets. Er zaten geen trappers aan: je zette je met je voeten af tegen de grond.",
 "Rond 1860 kwamen er in Frankrijk fietsen met trappers aan het voorwiel. Hoe groter het voorwiel, hoe verder je kwam met één rondje trappen. Daarom werd het voorwiel steeds groter. Zo ontstond de hoge bi, met een voorwiel dat soms anderhalve meter hoog was. Snel was hij wel, maar ook gevaarlijk: wie hard remde of een steen raakte, viel zo voorover.",
 "In 1885 bedacht de Engelsman John Kemp Starley de veiligheidsfiets. Die had twee even grote wielen en een ketting die het achterwiel aandreef. Je zat veel lager en kon met je voeten bij de grond. Drie jaar later kwam de luchtband, waardoor fietsen veel minder hard schokte.",
 "Vanaf dat moment werd fietsen populair bij een groot publiek. Eerst was een fiets nog duur, maar toen fabrieken ze in grote aantallen gingen maken, werden ze goedkoper. Voor veel arbeiders werd de fiets het eerste vervoermiddel dat ze zelf konden betalen."],
 v:[["opbouw","Hoe is deze tekst vooral opgebouwd?",["in de volgorde van de tijd","als probleem en oplossing","als vraag en antwoord","als voor- en nadelen"],"De tekst volgt de jaartallen: 1817, rond 1860, 1885, drie jaar later. Dat is een opbouw in tijdsvolgorde.",null],
    ["verband","'Daarom werd het voorwiel steeds groter' (alinea 2). Wat is de reden?",["Met een groter voorwiel kwam je verder met één rondje trappen.","Grote wielen waren veiliger.","Mensen wilden hoger zitten om beter te kijken.","Het voorwiel moest de ketting aandrijven."],"'Daarom' wijst terug naar de zin ervoor.","Hoe groter het voorwiel, hoe verder je kwam met één rondje trappen."],
    ["zoek","In welk jaar kwam de luchtband?",["1888","1885","1860","1817"],"De veiligheidsfiets kwam in 1885. 'Drie jaar later' kwam de luchtband: 1885 + 3 = 1888.","Drie jaar later kwam de luchtband"],
    ["afleid","Waarom werd fietsen 'populair bij een groot publiek' (alinea 4)?",["De fiets werd veiliger, comfortabeler en goedkoper.","De hoge bi was heel snel.","Karl Drais maakte veel reclame.","Nederland had veel inwoners."],"Alinea 3 vertelt dat de fiets veiliger en comfortabeler werd. Alinea 4 vertelt dat hij goedkoper werd. Samen verklaren ze waarom veel mensen gingen fietsen.","toen fabrieken ze in grote aantallen gingen maken, werden ze goedkoper"]]},
{lvl:4,t:"Mijn telefoon in het kluisje",soort:"column (betoog)",p:[
 "Toen ik vorig jaar naar de brugklas ging, moest mijn telefoon tijdens de lessen in een kluisje. Ik vond dat eerst onzin. Ik ben toch geen klein kind meer? Inmiddels denk ik er anders over.",
 "Het grootste voordeel merk ik in de lessen. Vroeger lag mijn telefoon naast mijn schrift, en elke keer dat hij trilde, was ik met mijn gedachten weg. Nu kan ik me beter concentreren. Mijn cijfer voor wiskunde is zelfs omhooggegaan, van een 5,8 naar een 7,1.",
 "Ook in de pauze is er iets veranderd. Eerst zat iedereen op zijn scherm te kijken. Nu praten we weer met elkaar, en sommige klasgenoten zijn zelfs gaan tafeltennissen. Er zijn natuurlijk ook nadelen. Als je ouders je onder schooltijd willen bereiken, kan dat niet meteen. Mijn moeder vond dat in het begin lastig. Maar via de administratie van school kan het altijd.",
 "Sommige leerlingen zeggen dat een verbod niet nodig is, omdat ze zelf wel weten wanneer ze hun telefoon moeten wegleggen. Dat geloof ik best, maar ik weet ook hoe moeilijk het is om níét te kijken als er een berichtje binnenkomt. Een kluisje maakt het een stuk makkelijker. Wat mij betreft blijft het verbod dus."],
 v:[["fm","Welke zin is een feit?",["Mijn cijfer voor wiskunde is zelfs omhooggegaan, van een 5,8 naar een 7,1.","Een kluisje maakt het een stuk makkelijker.","Wat mij betreft blijft het verbod dus.","Een telefoonverbod is goed voor alle leerlingen."],"Een cijfer kun je controleren op het rapport. De andere zinnen geven weer wat iemand vindt.","Mijn cijfer voor wiskunde is zelfs omhooggegaan, van een 5,8 naar een 7,1."],
    ["opbouw","Wat doet de schrijver in alinea 4?",["Ze noemt een tegenargument en reageert erop.","Ze vertelt wat er in de pauze veranderd is.","Ze noemt het grootste voordeel.","Ze vertelt hoe het verbod begon."],"Eerst staat wat andere leerlingen vinden (een tegenargument). Daarna reageert ze: 'Dat geloof ik best, maar…'.",null],
    ["verband","'Maar via de administratie van school kan het altijd' (alinea 3). Wat geeft deze zin?",["een oplossing voor het nadeel dat net genoemd is","nog een nadeel","een voorbeeld van een voordeel","de conclusie van de hele tekst"],"Het nadeel is dat ouders je niet meteen kunnen bereiken. Na 'Maar' volgt hoe dat toch kan.","Maar via de administratie van school kan het altijd."],
    ["afleid","Wat bedoelt de schrijver met 'Inmiddels denk ik er anders over' (alinea 1)?",["Ze vindt het kluisje nu wel een goed idee.","Ze wil dat het verbod stopt.","Ze is haar telefoon kwijtgeraakt.","Ze vindt de kluisjes te klein."],"Eerst vond ze het onzin. 'Anders' betekent dus dat ze het nu goed vindt. Dat blijkt ook uit de laatste zin van de tekst.","Inmiddels denk ik er anders over."]]},
{lvl:4,t:"De laatste nacht",soort:"verhaal",p:[
 "Al veertig jaar beklom Jelle elke avond de honderdzesentwintig treden van de vuurtoren. Boven draaide hij aan de knop, en het licht zwiepte over de golven als een arm die de schepen naar huis wees.",
 "Maar vanavond was het anders. Morgen zou de vuurtoren automatisch worden. Een computer in een kantoor in de stad zou het licht aan- en uitzetten. Jelle was niet meer nodig. 'Een machine wordt niet moe,' had de man van het waterschap gezegd, alsof dat Jelle zou troosten.",
 "Hij ging op zijn krukje zitten en keek naar buiten. In de verte gleed een vrachtschip voorbij, met lichtjes als een drijvende stad. Zou de kapitein weten dat dit de laatste nacht was? Waarschijnlijk niet. Voor de schepen veranderde er niets. Het licht zou blijven draaien. Alleen hij zou er niet meer bij zijn.",
 "Toen de zon opkwam, liep Jelle langzaam de trap af. Halverwege bleef hij staan en legde zijn hand op de koude, gladde muur. 'Pas goed op ze,' fluisterde hij. Daarna trok hij de deur zachtjes achter zich dicht."],
 v:[["woord","'…het licht zwiepte over de golven als een arm die de schepen naar huis wees' (alinea 1). Wat bedoelt de schrijver?",["Het licht helpt de schepen de veilige weg te vinden.","Jelle zwaait naar de schepen.","Het licht maakt de golven groter.","De schepen varen weg van huis."],"Dit is een vergelijking (beeldspraak): het licht wijst de weg, zoals een arm de weg wijst.","als een arm die de schepen naar huis wees"],
    ["afleid","Hoe voelt Jelle zich vooral in dit verhaal?",["verdrietig, omdat er een einde komt aan zijn werk","opgelucht, omdat hij niet meer hoeft te klimmen","boos op de kapitein","bang voor de computer"],"Hij is 'niet meer nodig', kijkt nog één keer naar buiten en neemt afscheid van de toren. Dat laat verdriet zien.","Alleen hij zou er niet meer bij zijn."],
    ["afleid","'…alsof dat Jelle zou troosten' (alinea 2). Wat laat de schrijver hiermee zien?",["Dat die opmerking Jelle juist níét troost.","Dat Jelle blij is met de machine.","Dat de man van het waterschap moe is.","Dat de computer kapot is."],"'Alsof' betekent hier: de man dácht dat het zou troosten, maar dat deed het niet. Het maakt Jelle eerder verdrietiger.","alsof dat Jelle zou troosten"],
    ["verwijs","'Pas goed op ze,' fluistert Jelle (alinea 4). Wie bedoelt hij met 'ze'?",["de schepen","de treden","de mensen van het waterschap","de golven"],"Jelle praat tegen de vuurtoren. Hij vraagt de toren om goed op de schepen te passen, zoals hij veertig jaar deed.","'Pas goed op ze,' fluisterde hij."]]},

function lzItem(t,v){const opts=shuffle(v[2]);return {kind:"mc",cat:LSKILLS[v[0]].n,skill:v[0],text:t,prompt:v[1],options:opts,answer:opts.indexOf(v[2][0]),explain:v[3],ev:v[4]}}
function makeLezen(q,skill){
  if(skill){const all=[];LZ.forEach(t=>t.v.forEach(v=>{if(v[0]===skill)all.push([t,v])}));
    return shuffle(all).slice(0,8).sort((a,b)=>a[0].lvl-b[0].lvl).map(([t,v])=>lzItem(t,v))}
  const main=shuffle(LZ.filter(t=>t.lvl===q)),prev=shuffle(LZ.filter(t=>t.lvl===q-1));
  const texts=q===1?main.slice(0,4):[...prev.slice(0,1),...main.slice(0,3)];
  const items=[];texts.forEach((t,ti)=>t.v.forEach((v,vi)=>{const it=lzItem(t,v);if(vi===0){it.newText=ti+1;it.textCount=texts.length}items.push(it)}));

}

function checkAnswer(it,val){
  if(it.kind==="mc") return val===it.answer;
  if(it.kind==="num") return parseNums(val).some(x=>Math.abs(x-it.answer)<1e-6);
  if(it.kind==="time"){const t=parseTime(val);return t!==null&&((t-it.answer)%1440+1440)%1440===0}
  if(it.kind==="frac"){const f=parseFrac(val);if(!f)return false;const same=Math.abs(f.n/f.d-it.answer.n/it.answer.d)<1e-9;if(!same)return false;if(it.simplest)return gcd(f.n,f.d)===1&&f.d===it.answer.d;return true}
  return false;
}
function answerText(it){
  if(it.kind==="mc")return it.options[it.answer];
  if(it.kind==="num")return nf(it.answer,4)+(it.unit?" "+it.unit:"");
  if(it.kind==="time")return hm(it.answer)+" uur";
  if(it.kind==="frac")return it.answer.d===1?String(it.answer.n):`${it.answer.n}/${it.answer.d}`;
}
function givenText(it,val){
  if(val===null||val===undefined||val==="")return "geen antwoord";
  if(it.kind==="mc")return it.options[val]??"geen antwoord";
  return String(val)+(it.unit&&it.kind==="num"?" "+it.unit:"");
}

const Store={mode:"local",db:null,students:[],results:[],
  async init(){

    if(!db){setBadge();render();return}
    this.db=db; this.mode="shared"; this.students=[]; this.results=[]; setBadge();
    db.collection("students").onSnapshot(s=>{this.students=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},e=>this.fail(e));
    db.collection("results").orderBy("at","desc").limit(1000).onSnapshot(s=>{this.results=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},e=>this.fail(e));
  },
  fail(e){ if(this.mode==="shared"){toast("Gedeelde opslag niet bereikbaar. Resultaten worden op dit apparaat bewaard.");this.mode="local";this.db=null;const loc=lsGet(LS_KEY,{students:[],results:[]});this.students=loc.students;this.results=loc.results;setBadge();render()} },
  saveLocal(){lsSet(LS_KEY,{students:this.students,results:this.results})},
  async put(col,obj){
    if(this.mode==="shared"){try{const {id,...rest}=obj;await this.db.collection(col).doc(id).set(rest);return true}catch(e){
      if(e&&e.code==="invalid_argument"){toast("Je hebt alleen kijkrechten. Vraag de eigenaar om je 'Contributor' te maken om resultaten op te slaan.");return false}
      if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{const {id,...rest}=obj;await this.db.collection(col).doc(id).set(rest);return true}catch(e2){}}
      toast("Opslaan lukte niet: "+(e&&e.message||"onbekende fout"));return false}}
    const arr=col==="students"?this.students:this.results; const i=arr.findIndex(x=>x.id===obj.id); if(i>=0)arr[i]=obj; else arr.unshift(obj); this.saveLocal(); render(); return true;
  },
  async del(col,id){
    if(this.mode==="shared"){try{await this.db.collection(col).doc(id).delete();return true}catch(e){toast("Verwijderen lukte niet.");return false}}
    if(col==="students")this.students=this.students.filter(x=>x.id!==id); else this.results=this.results.filter(x=>x.id!==id); this.saveLocal(); render(); return true;
  }
};
